<style>
:root{--g:#00C48C;--gd:#009A6C;--gl:#E8FAF4;--o:#FF6B35;--gy:#f9fafb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--gy);color:#1f2937;line-height:1.7}
.header{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:32px 20px;text-align:center}
.header h1{font-size:1.6em;margin-bottom:4px}
.header p{opacity:.85;font-size:.9em}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.nav button{padding:8px 20px;border-radius:20px;border:2px solid #e5e7eb;background:#fff;cursor:pointer;font-size:.85em;font-weight:600;font-family:inherit;transition:all .2s}
.nav button:hover,.nav button.active{background:var(--g);color:#fff;border-color:var(--g)}
.container{max-width:900px;margin:0 auto;padding:20px}
.grade-section{margin-bottom:40px;display:none}
.grade-section.active{display:block}
.grade-title{font-size:1.3em;font-weight:700;color:var(--gd);margin-bottom:6px;padding-bottom:8px;border-bottom:3px solid var(--g)}
.grade-desc{color:#6b7280;font-size:.85em;margin-bottom:20px}
.q-card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:20px 24px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.q-card:hover{border-color:var(--g)}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q-type{display:inline-block;padding:3px 10px;border-radius:8px;font-size:.75em;font-weight:700;color:#fff}
.q-type.scene{background:#FF6B35}
.q-type.know{background:#3B7CFF}
.q-type.self{background:#7C3AED}
.q-type.pref{background:#DB2777}
.q-idx{font-size:.8em;color:#9ca3af}
.q-text{font-size:1.05em;font-weight:600;margin-bottom:14px;line-height:1.6}
.q-opts{margin:10px 0;padding:0}
.q-opt{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:4px 0;background:#f9fafb;border-radius:8px;font-size:.88em}
.q-opt .letter{width:26px;height:26px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8em;flex-shrink:0}
.q-opt.correct{background:#D1FAE5;border:1px solid #A7F3D0}
.q-opt.correct .letter{background:var(--g);color:#fff}
.q-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid #f3f4f6;font-size:.78em;color:#6b7280}
.q-meta span{background:#f3f4f6;padding:2px 8px;border-radius:6px}
.section-header{background:var(--gl);padding:10px 16px;border-radius:8px;margin:20px 0 12px;font-weight:700;color:var(--gd);font-size:.95em}
footer{text-align:center;padding:30px;color:#9ca3af;font-size:.8em}
@media print{.nav{display:none}.grade-section{display:block!important;page-break-after:always}}
</style>

function renderGrade(key) {
  var g = grades[key];
  var html = '<div class="grade-title">' + g.title + '</div>';
  html += '<div class="grade-desc">📌 ' + g.desc + '</div>';

  var lastSection = '';
  g.questions.forEach(function(q) {
    if (q.sn && q.sn !== lastSection) {
      html += '<div class="section-header">' + q.sn + '</div>';
      lastSection = q.sn;
    }
    var labels = {scene:'情景',know:'知识',self:'自评',pref:'偏好'};
    html += '<div class="q-card">';
    html += '<div class="q-header"><span class="q-type ' + q.s + '">' + labels[q.s] + '</span><span class="q-idx">#' + q.id + '</span></div>';
    html += '<div class="q-text">' + q.q + '</div>';
    q.o.forEach(function(o, i) {
      var cls = (q.correct === i) ? ' correct' : '';
      html += '<div class="q-opt' + cls + '"><span class="letter">' + 'ABCD'[i] + '</span> ' + o + (q.correct===i?'  ✅': '') + '</div>';
    });
    html += '<div class="q-meta">';
    if (q.likert) {
      html += '<span>📊 Likert量表 · 维度: ' + dimNames[q.dim] + ' · 分值: [' + q.lm.join(',') + ']</span>';
    }
    if (q.sc) {
      html += '<span>📏 计分: ';
      q.sc.forEach(function(s, i) {
        html += '选项' + 'ABCD'[i] + ' → ';
        var parts = [];
        Object.keys(s).forEach(function(k) { parts.push(dimNames[k] + (s[k]>0?'+':'') + s[k]); });
        html += parts.join(', ') + (i < q.sc.length-1 ? ' | ' : '');
      });
      html += '</span>';
    }
    if (q.styles) {
      html += '<span>🎨 风格标签: ' + q.styles.join(', ') + '</span>';
    }
    html += '</div></div>';
  });

  document.getElementById('content').innerHTML = html;
}

function showGrade(key) {
  document.querySelectorAll('.nav button').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');
  renderGrade(key);
}
