<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高途 · 教师后台</title>
<style>
:root{
  --r:#E54545;--r2:#C62828;--r-light:#FFF0F0;--r-bg:#FFFBFA;
  --o:#FF8C42;--blue:#3B7CFF;--purple:#7C3AED;
  --g50:#fafafa;--g100:#f5f5f5;--g200:#e5e5e5;--g300:#d4d4d4;
  --g400:#a3a3a3;--g500:#737373;--g600:#525252;--g700:#404040;--g800:#262626;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--g800);background:var(--r-bg);line-height:1.6;min-height:100vh;
}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 40px}

/* Top */
.topbar{
  background:linear-gradient(135deg,var(--r),var(--r2));
  color:#fff;padding:24px 28px;text-align:center;
  border-radius:0 0 20px 20px;margin-bottom:24px;
}
.topbar h1{font-size:1.3em;letter-spacing:1px}
.topbar .sub{font-size:.78em;opacity:.8;margin-top:2px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat{
  background:#fff;border-radius:14px;border:1px solid #FFE0E0;
  padding:20px;text-align:center;
}
.stat .n{font-size:2em;font-weight:800;color:var(--r)}
.stat .l{font-size:.8em;color:var(--g500);margin-top:2px}

/* Card */
.card{
  background:#fff;border-radius:16px;border:1px solid #FFE0E0;
  padding:24px 28px;margin-bottom:18px;
}
.card h2{font-size:1.05em;color:var(--g800);margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* Type distribution */
.type-bar{margin:6px 0;display:flex;align-items:center;gap:10px}
.type-bar .tname{width:100px;font-size:.82em;text-align:right;flex-shrink:0;font-weight:500}
.type-bar .ttrack{flex:1;height:22px;background:var(--g100);border-radius:11px;overflow:hidden}
.type-bar .tfill{height:100%;border-radius:11px;transition:width .5s}
.type-bar .tcnt{width:40px;font-size:.82em;text-align:center;flex-shrink:0;font-weight:600}

/* Filter row */
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filter-chip{
  padding:6px 16px;border-radius:12px;font-size:.82em;font-weight:500;
  cursor:pointer;border:1px solid var(--g200);background:#fff;
  font-family:inherit;transition:all .15s;
}
.filter-chip:hover{border-color:var(--r)}
.filter-chip.active{background:var(--r);color:#fff;border-color:var(--r)}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84em;min-width:700px}
thead th{
  background:var(--r-light);color:var(--r2);font-weight:600;
  text-align:left;padding:10px 12px;border-bottom:2px solid #FFD0D0;white-space:nowrap;
}
tbody td{padding:9px 12px;border-bottom:1px solid var(--g100)}
tbody tr:hover{background:var(--r-bg)}
.clickable{cursor:pointer;color:var(--r);font-weight:500}
.clickable:hover{text-decoration:underline}

/* Dimension mini tags */
.dtags{display:flex;gap:3px;flex-wrap:wrap}
.dtag{font-size:.7em;padding:2px 6px;border-radius:5px;white-space:nowrap}
.dt-lo{background:#FEF2F2;color:var(--r)}
.dt-hi{background:#F0FDF4;color:#16A34A}

/* Buttons */
.btn{
  display:inline-block;padding:9px 20px;border-radius:10px;
  font-size:.85em;font-weight:600;cursor:pointer;border:none;
  transition:all .2s;font-family:inherit;
}
.btn-pri{background:var(--r);color:#fff}
.btn-pri:hover{background:var(--r2)}
.btn-sec{background:var(--g100);color:var(--g700)}
.btn-sec:hover{background:var(--g200)}
.btn-red{background:#fff;color:var(--r);border:1px solid #FFD0D0}
.btn-red:hover{background:var(--r-light)}
.btn-sm{padding:6px 14px;font-size:.78em;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* Modal */
.modal{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.4);z-index:200;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;
}
.modal.show{display:flex}
.modal-box{
  background:#fff;border-radius:18px;padding:28px;max-width:700px;width:100%;
  animation:slideUp .3s;
}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

/* Report bars in modal */
.rbar{margin:8px 0}
.rbar-row{display:flex;align-items:center;gap:10px;margin:5px 0}
.rbar-label{width:100px;font-size:.82em;text-align:right;flex-shrink:0;color:var(--g600)}
.rbar-track{flex:1;height:16px;background:var(--g100);border-radius:8px;overflow:hidden}
.rbar-fill{height:100%;border-radius:8px;transition:width .6s}
.rbar-num{width:40px;font-size:.82em;font-weight:700;text-align:center;flex-shrink:0}

.asym-badge{
  display:inline-block;padding:4px 12px;border-radius:10px;
  font-size:.8em;font-weight:600;margin-left:6px;
}
.asym-badge.warn{background:#FEF2F2;color:var(--r)}
.asym-badge.ok{background:#F0FDF4;color:#16A34A}

footer{text-align:center;padding:24px;color:var(--g400);font-size:.78em}
footer .gt{color:var(--r);font-weight:600}

.type-icon{font-size:2em;margin-right:8px}

/* Heatmap */
.hm-table{border-collapse:collapse;font-size:.78em}
.hm-table th{font-size:.75em;color:var(--g600);padding:4px 6px;text-align:center;white-space:nowrap;cursor:pointer}
.hm-table th:hover{color:var(--r)}
.hm-table td{padding:1px 3px;text-align:center}
.hm-cell{display:inline-block;width:38px;height:30px;border-radius:6px;line-height:30px;font-weight:700;font-size:.82em;cursor:default;position:relative}
.hm-cell:hover{transform:scale(1.2);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hm-cell::after{content:attr(data-tip);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:2px 8px;border-radius:4px;font-size:.75em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.hm-cell:hover::after{opacity:1}
.hm-avg{font-weight:700;font-size:.85em;padding:6px 4px;border-top:2px solid var(--g300)}
.hm-name{font-size:.8em;color:var(--g700);white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis;padding:4px 6px;text-align:right}
.hm-legend{display:flex;gap:12px;align-items:center;font-size:.75em;color:var(--g500);margin-top:10px;flex-wrap:wrap}
.hm-leg{display:flex;align-items:center;gap:4px}
.hm-leg-sq{width:14px;height:14px;border-radius:3px}

/* Decision support */
.adv-item{margin:8px 0;padding:12px 16px;border-radius:12px;border-left:4px solid var(--r)}
.adv-item h4{font-size:.9em;color:var(--r);margin-bottom:4px}
.adv-action{background:var(--r-light);border-radius:8px;padding:10px 14px;margin-top:6px;font-size:.84em}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="topbar">
  <h1>📊 班级英语画像总览</h1>
  <div class="sub" id="syncStatus">⏳ 正在连接云端...</div>
</div>

<div class="wrap">

<!-- Stats -->
<div class="stat-grid" id="statsRow"></div>

<!-- Type distribution -->
<div class="card">
  <h2>🏷️ 学员类型分布</h2>
  <div id="typeDist"></div>
</div>

<!-- Heatmap -->
<div class="card" id="heatmapCard">
  <h2>🔥 班级热力图 <span style="font-weight:400;font-size:.78em;color:var(--g500)">半秒看短板</span></h2>
  <div style="overflow-x:auto" id="heatmapWrap"></div>
</div>

<!-- Student list -->
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <h2 style="margin:0">👨‍🎓 学员记录</h2>
    <div class="btn-row">
      <button class="btn btn-pri btn-sm" onclick="exportCSV()">📥 导出 CSV</button>
      <button class="btn btn-red btn-sm" onclick="clearData()">🗑 清空</button>
    </div>
  </div>
  <div class="filter-row" id="filterRow" style="margin-top:12px"></div>
  <div class="tbl-wrap">
    <table><thead><tr><th>姓名</th><th>学段</th><th>日期</th><th>类型</th><th>输入/输出</th><th>最弱 ↔ 最强</th><th>操作</th></tr></thead><tbody id="tblBody"></tbody></table>
  </div>
  <div id="emptyHint" style="text-align:center;padding:36px;color:var(--g400)">还没有诊断数据<br><span style="font-size:.8em">打开"学生端"完成诊断后，数据会自动出现在这里</span></div>
</div>

<!-- Decision Support -->
<div class="card" id="adviceCard">
  <h2>💡 教学决策建议</h2>
  <div id="adviceContent" style="font-size:.88em;line-height:1.8;color:var(--g700)"></div>
</div>

</div><!-- wrap -->

<!-- Detail Modal -->
<div class="modal" id="detailModal">
  <div class="modal-box" id="detailContent"></div>
</div>

<!-- Compare Modal -->
<div class="modal" id="compareModal">
  <div class="modal-box" id="compareContent" style="max-width:800px"></div>
</div>

<footer><span class="gt">高途</span> · 教师后台 · 学生画像数据自动同步</footer>

<script>
// ==================== FIREBASE ====================
const firebaseConfig = {
  apiKey: "AIzaSyCnnQmSs3TsnmuoTPOUBx-Sf4eucNVRLTQ",
  authDomain: "gaotu-diagnostic.firebaseapp.com",
  projectId: "gaotu-diagnostic",
  storageBucket: "gaotu-diagnostic.firebasestorage.app",
  messagingSenderId: "109824619609",
  appId: "1:109824619609:web:41f749de0021de4ad26d48"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = 'students';
let allStudents = [];

// ==================== DATA ====================
function loadLocalData() {
  var local = [];
  try {
    var raw = localStorage.getItem('gt_eng_diag_students');
    if (raw) { local = JSON.parse(raw); }
  } catch(_) {}
  // Normalize
  local.forEach(function(s, i) {
    if (!s.id) s.id = 90000 + i;
    if (!s.vocab && s.std) { s.vocab = s.std.vocab || 0; s.grammar = s.std.grammar || 0; s.speed = s.std.speed || 0; s.intuition = s.std.intuition || 0; s.express = s.std.express || 0; s.adapt = s.std.adapt || 0; }
    if (!s.inputScore) s.inputScore = 0;
    if (!s.outputScore) s.outputScore = 0;
    if (!s.gap) s.gap = 0;
    if (!s.date) s.date = s.timestamp ? s.timestamp.slice(0, 10) : '';
    if (!s.typeId) s.typeId = s.type || '';
    if (!s.typeName) s.typeName = s.type || '';
    if (!s.typeIcon) s.typeIcon = '';
    if (!s.weakKey) s.weakKey = '';
    if (!s.strongKey) s.strongKey = '';
    if (Array.isArray(s.cogData)) { s.cogData = s.cogData; }
    else if (typeof s.cogData === 'string') { try { s.cogData = JSON.parse(s.cogData); } catch(_) { s.cogData = []; } }
    else { s.cogData = []; }
    if (Array.isArray(s.stylePrefs)) { s.stylePrefs = s.stylePrefs; }
    else if (typeof s.stylePrefs === 'string') { try { s.stylePrefs = JSON.parse(s.stylePrefs); } catch(_) { s.stylePrefs = []; } }
    else { s.stylePrefs = []; }
    s.std = { vocab: s.vocab || 0, grammar: s.grammar || 0, speed: s.speed || 0, intuition: s.intuition || 0, express: s.express || 0, adapt: s.adapt || 0 };
  });
  return local;
}

function mergeData(serverData, localData) {
  var seen = {};
  var merged = [];
  (serverData || []).forEach(function(s) {
    var key = s.name + '|||' + s.grade + '|||' + s.date;
    if (!seen[key]) { seen[key] = true; merged.push(s); }
  });
  (localData || []).forEach(function(s) {
    var key = s.name + '|||' + s.grade + '|||' + s.date;
    if (!seen[key]) { seen[key] = true; merged.push(s); }
  });
  return merged;
}

function listenToData(){
  var localData = loadLocalData();
  var statusEl = document.getElementById('syncStatus');

  db.collection(COLLECTION).orderBy('timestamp','desc').onSnapshot(function(snap){
    var serverData = [];
    snap.forEach(function(doc){
      var d = doc.data();
      d.id = doc.id;
      d.std = { vocab: d.vocab || 0, grammar: d.grammar || 0, speed: d.speed || 0, intuition: d.intuition || 0, express: d.express || 0, adapt: d.adapt || 0 };
      if (typeof d.cogData === 'string') { try { d.cogData = JSON.parse(d.cogData); } catch(_) { d.cogData = []; } }
      if (typeof d.stylePrefs === 'string') { try { d.stylePrefs = JSON.parse(d.stylePrefs); } catch(_) { d.stylePrefs = []; } }
      serverData.push(d);
    });
    // ALWAYS merge with local data
    allStudents = mergeData(serverData, localData);
    if (statusEl) statusEl.innerHTML = '✅ 云端连接正常 · ' + allStudents.length + ' 条记录';
    if (statusEl) statusEl.style.color = '#16A34A';
    render();
  }, function(err){
    console.error('Firestore error:', err);
    // Firebase failed — use localStorage only
    allStudents = localData;
    if (statusEl) statusEl.innerHTML = '⚠️ 云端连接失败，显示本地数据 · ' + allStudents.length + ' 条记录';
    if (statusEl) statusEl.style.color = '#FF8C42';
    render();
  });
}

// ==================== RENDER ====================
let currentFilter='all';

function render(){
  const students=allStudents;
  const filtered=currentFilter==='all'?students:students.filter(s=>s.grade===currentFilter);

  // Stats
  const names=new Set(students.map(s=>s.name)).size;
  const types=new Set(filtered.map(s=>s.typeName)).size;
  const avgGap=filtered.length?Math.round(filtered.reduce((a,s)=>a+s.gap,0)/filtered.length):0;
  document.getElementById('statsRow').innerHTML=
    '<div class="stat"><div class="n">'+students.length+'</div><div class="l">总诊断次数</div></div>'+
    '<div class="stat"><div class="n">'+names+'</div><div class="l">独立学员</div></div>'+
    '<div class="stat"><div class="n">'+types+'</div><div class="l">类型种类</div></div>'+
    '<div class="stat"><div class="n">'+avgGap+'</div><div class="l">平均输入输出落差</div></div>';

  // Filters
  const grades=[...new Set(students.map(s=>s.grade))];
  let fHTML='<button class="filter-chip'+(currentFilter==='all'?' active':'')+'" onclick="setFilter(\'all\')">全部</button>';
  grades.forEach(g=>fHTML+='<button class="filter-chip'+(currentFilter===g?' active':'')+'" onclick="setFilter(\''+g+'\')">'+g+'</button>');
  document.getElementById('filterRow').innerHTML=fHTML;

  // Type distribution
  const tCount={};
  filtered.forEach(s=>{tCount[s.typeName]=(tCount[s.typeName]||0)+1;});
  const sorted=Object.entries(tCount).sort((a,b)=>b[1]-a[1]);
  const maxCnt=sorted.length?sorted[0][1]:1;
  const tColors=['#E54545','#FF8C42','#FFB703','#7C3AED','#3B7CFF','#DB2777','#0D9488','#16A34A','#B45309','#6B7280'];
  let tHTML='';
  sorted.forEach(([t,c],i)=>{
    tHTML+='<div class="type-bar"><div class="tname">'+t+'</div><div class="ttrack"><div class="tfill" style="width:'+(c/maxCnt*100)+'%;background:'+tColors[i%tColors.length]+'"></div></div><div class="tcnt">'+c+'人</div></div>';
  });
  document.getElementById('typeDist').innerHTML=tHTML||'<span style="color:var(--g400)">暂无数据</span>';

  // Heatmap
  const dimNames={vocab:'词汇',grammar:'语法',speed:'速度',intuition:'语感',express:'表达',adapt:'适应'};
  const dimColors={vocab:'#3B7CFF',grammar:'#B45309',speed:'#FF6B35',intuition:'#7C3AED',express:'#DB2777',adapt:'#0D9488'};
  const dimKeys=['vocab','grammar','speed','intuition','express','adapt'];
  const hmColor=v=>v>=80?'#16A34A':v>=65?'#7BC89C':v>=55?'#FFB703':v>=40?'#FF8C42':'#E54545';
  let hmHTML='';
  if(filtered.length){
    hmHTML='<table class="hm-table"><thead><tr><th>学员</th>';
    dimKeys.forEach(k=>hmHTML+='<th onclick="sortHeatmap(\''+k+'\')" title="按此维度排序">'+dimNames[k]+'</th>');
    hmHTML+='</tr></thead><tbody>';
    const hmRows=filtered.map(s=>({name:s.name,grade:s.grade,std:s.std,id:s.id}));
    hmRows.forEach((r,i)=>{
      hmHTML+='<tr><td class="hm-name" title="'+r.name+'·'+r.grade+'">'+r.name+'</td>';
      dimKeys.forEach(k=>{
        const v=r.std[k];
        hmHTML+='<td><span class="hm-cell" style="background:'+hmColor(v)+';color:'+(v<55?'#fff':'#333')+'" data-tip="'+dimNames[k]+':'+v+'" onclick="viewDetail('+r.id+')">'+v+'</span></td>';
      });
      hmHTML+='</tr>';
    });
    // Averages row
    hmHTML+='<tr><td class="hm-avg" style="text-align:right;color:var(--g600)">班级均值</td>';
    dimKeys.forEach(k=>{
      const avg=Math.round(filtered.reduce((a,s)=>a+s.std[k],0)/filtered.length);
      hmHTML+='<td class="hm-avg" style="color:'+(avg<50?'var(--r)':avg<60?'var(--o)':'#16A34A')+'">'+avg+'</td>';
    });
    hmHTML+='</tr></tbody></table>';
    hmHTML+='<div class="hm-legend"><span class="hm-leg"><span class="hm-leg-sq" style="background:#E54545"></span>弱(0-40)</span><span class="hm-leg"><span class="hm-leg-sq" style="background:#FF8C42"></span>偏弱(40-55)</span><span class="hm-leg"><span class="hm-leg-sq" style="background:#FFB703"></span>中等(55-65)</span><span class="hm-leg"><span class="hm-leg-sq" style="background:#7BC89C"></span>良好(65-80)</span><span class="hm-leg"><span class="hm-leg-sq" style="background:#16A34A"></span>优秀(80+)</span></div>';
  }else{
    hmHTML='<span style="color:var(--g400)">暂无数据</span>';
  }
  document.getElementById('heatmapWrap').innerHTML=hmHTML;

  // Table — group by name+grade
  const groups={};
  filtered.forEach(s=>{const k=s.name+'|||'+s.grade;if(!groups[k])groups[k]=[];groups[k].push(s);});
  let tb='';
  Object.values(groups).sort((a,b)=>b[0].id-a[0].id).forEach(g=>{
    g.sort((a,b)=>b.id-a.id);
    const s=g[0];
    const hN=g.length;
    const ent=Object.entries(s.std).sort((a,b)=>a[1]-b[1]);
    const wk=ent[0],st=ent[ent.length-1];
    const gapTag=s.gap>=18?'<span class="asym-badge warn">⚠'+s.gap+'</span>':'<span class="asym-badge ok">'+s.gap+'</span>';
    const histBadge=hN>1?' <span style="background:var(--r-light);color:var(--r);border-radius:8px;padding:1px 6px;font-size:.7em;cursor:pointer" onclick="showCompare(\''+s.name+'\',\''+s.grade+'\')" title="查看历史对比">'+hN+'次</span>':'';
    tb+='<tr>'+
      '<td class="clickable" onclick="viewDetail('+s.id+')">'+s.name+histBadge+'</td>'+
      '<td>'+s.grade+'</td><td>'+s.date+'</td>'+
      '<td>'+s.typeName+'</td>'+
      '<td>'+s.inputScore+'/'+s.outputScore+' '+gapTag+'</td>'+
      '<td><div class="dtags"><span class="dtag dt-lo">'+dimNames[wk[0]]+' '+wk[1]+'</span> → <span class="dtag dt-hi">'+dimNames[st[0]]+' '+st[1]+'</span></div></td>'+
      '<td><button class="btn btn-sec btn-sm" onclick="viewDetail('+s.id+')">查看</button>'+(hN>1?' <button class="btn btn-red btn-sm" onclick="showCompare(\''+s.name+'\',\''+s.grade+'\')">对比</button>':'')+' <button class="btn btn-red btn-sm" onclick="delOne('+s.id+')">删</button></td>'+
      '</tr>';
  });
  document.getElementById('tblBody').innerHTML=tb;
  document.getElementById('emptyHint').style.display=filtered.length?'none':'block';

  // Decision support
  const advice=generateAdvice(filtered);
  document.getElementById('adviceContent').innerHTML=advice;
}

function setFilter(f){currentFilter=f;render();}

// ==================== DETAIL VIEW ====================
function viewDetail(id){
  const s=allStudents.find(x=>x.id===id);if(!s)return;
  const dimNames={vocab:'词汇广度',grammar:'语法精准度',speed:'阅读速度与策略',intuition:'语感知觉',express:'表达意愿',adapt:'学习适应性'};
  const dimIcons={vocab:'📚',grammar:'🏗️',speed:'⚡',intuition:'💡',express:'🔥',adapt:'🧭'};
  const dimColors={vocab:'#3B7CFF',grammar:'#B45309',speed:'#FF6B35',intuition:'#7C3AED',express:'#DB2777',adapt:'#0D9488'};

  const ent=Object.entries(s.std).sort((a,b)=>a[1]-b[1]);
  const wk=ent[0],st=ent[ent.length-1];

  let h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><span style="font-size:2.2em">'+s.typeIcon+'</span><div><h3 style="margin:0">'+s.name+' · '+s.grade+'</h3><p style="color:var(--g500);font-size:.82em;margin:0">'+s.date+' · '+s.typeName+' · 输入'+s.inputScore+' / 输出'+s.outputScore+' · 落差'+s.gap+'</p></div></div>';

  h+='<h4 style="margin-bottom:8px;color:var(--g700)">六维能力</h4><div class="rbar">';
  Object.entries(s.std).forEach(([k,v])=>{
    h+='<div class="rbar-row"><div class="rbar-label">'+dimIcons[k]+' '+dimNames[k]+'</div><div class="rbar-track"><div class="rbar-fill" style="width:'+v+'%;background:'+dimColors[k]+'"></div></div><div class="rbar-num" style="color:'+dimColors[k]+'">'+v+'</div></div>';
  });
  h+='</div>';

  // Cog data
  if(s.cogData&&s.cogData.length){
    h+='<h4 style="margin-top:16px;margin-bottom:8px;color:var(--g700)">知识内化模式</h4>';
    const tc=s.cogData.length;
    const rc=s.cogData.filter(d=>d.cogType==='rule').length;
    const ic=s.cogData.filter(d=>d.cogType==='intuition').length;
    const sc=s.cogData.filter(d=>d.cogType==='strategy').length;
    const gc=s.cogData.filter(d=>d.cogType==='guess').length;
    h+='<div style="font-size:.85em">规则驱动 '+rc+'次('+(rc/tc*100).toFixed(0)+'%) · 语感驱动 '+ic+'次('+(ic/tc*100).toFixed(0)+'%) · 策略补偿 '+sc+'次 · 猜测 '+gc+'次</div>';
  }

  // Style prefs
  if(s.stylePrefs&&s.stylePrefs.length){
    h+='<h4 style="margin-top:16px;margin-bottom:8px;color:var(--g700)">学习偏好</h4>';
    h+='<div style="font-size:.85em">'+s.stylePrefs.join(' · ')+'</div>';
  }

  h+='<div style="margin-top:18px"><button class="btn btn-pri btn-sm" onclick="document.getElementById(\'detailModal\').classList.remove(\'show\')">关闭</button></div>';

  document.getElementById('detailContent').innerHTML=h;
  document.getElementById('detailModal').classList.add('show');
}
document.getElementById('detailModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
document.getElementById('compareModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});

// ==================== COMPARE ====================
function showCompare(name,grade){
  const all=allStudents.filter(s=>s.name===name&&s.grade===grade);
  all.sort((a,b)=>a.id-b.id);
  if(all.length<2)return;
  const a=all[all.length-2],b=all[all.length-1];
  const dimNames={vocab:'词汇广度',grammar:'语法精准度',speed:'阅读速度与策略',intuition:'语感知觉',express:'表达意愿',adapt:'学习适应性'};
  const dimIcons={vocab:'📚',grammar:'🏗️',speed:'⚡',intuition:'💡',express:'🔥',adapt:'🧭'};
  const dimColors={vocab:'#3B7CFF',grammar:'#B45309',speed:'#FF6B35',intuition:'#7C3AED',express:'#DB2777',adapt:'#0D9488'};
  let h='<h3 style="margin-bottom:4px">📈 '+name+' · '+grade+'</h3>';
  h+='<p style="color:var(--g500);font-size:.85em;margin-bottom:16px">'+a.date+' → '+b.date+'</p>';
  h+='<table style="width:100%;font-size:.85em;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:6px">维度</th><th style="text-align:center;padding:6px">上次</th><th style="text-align:center;padding:6px">本次</th><th style="text-align:center;padding:6px">变化</th></tr></thead><tbody>';
  const dimKeys=['vocab','grammar','speed','intuition','express','adapt'];
  dimKeys.forEach(k=>{
    const delta=b.std[k]-a.std[k];
    const arrow=delta>=8?'<span style="color:#16A34A;font-weight:700">↑ '+delta+'</span>':delta<=-8?'<span style="color:#E54545;font-weight:700">↓ '+Math.abs(delta)+'</span>':'<span style="color:#999">→ 0</span>';
    h+='<tr style="border-bottom:1px solid var(--g100)"><td style="padding:6px">'+dimIcons[k]+' '+dimNames[k]+'</td><td style="text-align:center;padding:6px;color:var(--g500)">'+a.std[k]+'</td><td style="text-align:center;padding:6px;font-weight:700;color:'+dimColors[k]+'">'+b.std[k]+'</td><td style="text-align:center;padding:6px">'+arrow+'</td></tr>';
  });
  h+='</tbody></table>';
  const improved=dimKeys.filter(k=>b.std[k]-a.std[k]>=8).length;
  const declined=dimKeys.filter(k=>b.std[k]-a.std[k]<=-8).length;
  h+='<div style="margin-top:14px;padding:12px;background:#FFF8F5;border-radius:10px;font-size:.84em">';
  if(improved>0&&declined===0) h+='✅ 全部维度稳中有升，'+improved+'个维度明显进步！保持当前策略。';
  else if(improved>0) h+='✅ '+improved+'个维度进步，⚠ '+declined+'个维度回落。对回落维度建议调整方法。';
  else if(declined>0) h+='⚠ '+declined+'个维度回落，建议排查原因并更换教学策略。';
  else h+='各维度变化不大，建议尝试新的学习方式突破平台期。';
  h+='</div>';
  h+='<div style="margin-top:14px"><button class="btn btn-pri btn-sm" onclick="document.getElementById(\'compareModal\').classList.remove(\'show\')">关闭</button></div>';
  document.getElementById('compareContent').innerHTML=h;
  document.getElementById('compareModal').classList.add('show');
}

// ==================== HEATMAP SORT ====================
let heatSortDim=null,heatSortAsc=true;
function sortHeatmap(dim){
  const students=allStudents;
  const filtered=currentFilter==='all'?students:students.filter(s=>s.grade===currentFilter);
  if(heatSortDim===dim){heatSortAsc=!heatSortAsc;}else{heatSortDim=dim;heatSortAsc=true;}
  filtered.sort((a,b)=>(heatSortAsc?1:-1)*(a.std[dim]-b.std[dim]));
  // Re-render heatmap rows
  let hmHTML='';
  const dimNames={vocab:'词汇',grammar:'语法',speed:'速度',intuition:'语感',express:'表达',adapt:'适应'};
  const dimKeys=['vocab','grammar','speed','intuition','express','adapt'];
  const hmColor=v=>v>=80?'#16A34A':v>=65?'#7BC89C':v>=55?'#FFB703':v>=40?'#FF8C42':'#E54545';
  filtered.forEach(r=>{
    hmHTML+='<tr><td class="hm-name" title="'+r.name+'·'+r.grade+'">'+r.name+'</td>';
    dimKeys.forEach(k=>{
      const v=r.std[k];
      hmHTML+='<td><span class="hm-cell" style="background:'+hmColor(v)+';color:'+(v<55?'#fff':'#333')+'" data-tip="'+dimNames[k]+':'+v+'" onclick="viewDetail('+r.id+')">'+v+'</span></td>';
    });
    hmHTML+='</tr>';
  });
  // Averages
  hmHTML+='<tr><td class="hm-avg" style="text-align:right;color:var(--g600)">班级均值</td>';
  dimKeys.forEach(k=>{
    const avg=Math.round(filtered.reduce((a,s)=>a+s.std[k],0)/filtered.length);
    hmHTML+='<td class="hm-avg" style="color:'+(avg<50?'var(--r)':avg<60?'var(--o)':'#16A34A')+'">'+avg+'</td>';
  });
  hmHTML+='</tr>';
  const tbody=document.querySelector('#heatmapWrap tbody');
  if(tbody) tbody.innerHTML=hmHTML;
}

// ==================== ADVICE ====================
function generateAdvice(filtered){
  if(!filtered.length) return '<span style="color:var(--g400)">暂无数据，无法生成建议</span>';
  const dimKeys=['vocab','grammar','speed','intuition','express','adapt'];
  const dimCN={vocab:'词汇广度',grammar:'语法精准度',speed:'阅读速度',intuition:'语感知觉',express:'表达意愿',adapt:'学习适应性'};
  const dimAct={
    vocab:'二讲落地：① 每日推送8个高频词+造句任务 ② 一周3次"看中文写英文"小测 ③ 制作班级词库共享文档，每人贡献5个生词',
    grammar:'二讲落地：① 每周发3组"正确vs错误"句子对比，让学生标注差异 ② 建立错题本检查制度，每两周跟盯一次 ③ 课堂前5分钟"找茬"游戏',
    speed:'二讲落地：① 每天1篇80词限时阅读打卡 ② 用计时器训练，先不限时再做限时 ③ 每周1次"速读比赛"，前三名发小奖励',
    intuition:'二讲落地：① 每日15分钟听力浸泡打卡（英文歌/动画/课文）② 班级群分享"今日听到的一个好句子"③ 周末推送15分钟英语短片',
    express:'二讲落地：① 发起"每日一句"活动——每人每天用英语写一句话 ② 先不纠错，建立信心 ③ 一周后开始"互评互改"',
    adapt:'二讲落地：① 专项"猜词训练"：选短文圈生词→先猜后查 ② 教学生"三步法"：猜→继续读→查证 ③ 鼓励分享"我猜对了"的成功经验'
  };
  let h='';
  // 1. Class averages
  const avgs={};let lowestDim='',lowestAvg=100;
  dimKeys.forEach(k=>{avgs[k]=Math.round(filtered.reduce((a,s)=>a+s.std[k],0)/filtered.length);if(avgs[k]<lowestAvg){lowestAvg=avgs[k];lowestDim=k;}});
  h+='<div class="adv-item"><h4>📊 班级维度均值</h4><p>词汇'+avgs.vocab+' / 语法'+avgs.grammar+' / 速度'+avgs.speed+' / 语感'+avgs.intuition+' / 表达'+avgs.express+' / 适应'+avgs.adapt+'</p>';
  if(lowestAvg<50) h+='<p style="color:var(--r);margin-top:4px"><strong>⚠ 班级共性短板：'+dimCN[lowestDim]+'（均值'+lowestAvg+'），建议教研组重点讨论</strong></p></div>';
  else h+='<p style="color:#16A34A;margin-top:4px">班级各维度均值正常，无严重短板</p></div>';

  // 2. Weakest dimension frequency
  const weakCount={};dimKeys.forEach(k=>{weakCount[k]=0;});
  filtered.forEach(s=>{const wk=Object.entries(s.std).sort((a,b)=>a[1]-b[1])[0][0];weakCount[wk]++;});
  const weakSorted=Object.entries(weakCount).sort((a,b)=>b[1]-a[1]);
  const topWeak=weakSorted[0];
  const topWeakPct=Math.round(topWeak[1]/filtered.length*100);
  if(topWeakPct>=40){
    h+='<div class="adv-item"><h4>🎯 短板集中预警</h4><p><strong>'+topWeakPct+'%</strong>的学生最弱维度集中在<strong>'+dimCN[topWeak[0]]+'</strong>（'+topWeak[1]+'/'+filtered.length+'人）</p><p style="margin-top:4px">建议本周安排该维度专项训练，优先解决班级共性短板。</p>';
    h+='<div class="adv-action">'+dimAct[topWeak[0]]+'</div></div>';
  }

  // 3. Input-output imbalance
  const gapCount=filtered.filter(s=>s.gap>=18).length;
  const gapPct=Math.round(gapCount/filtered.length*100);
  if(gapPct>=30){
    const inputStrong=filtered.filter(s=>s.gap>=18&&s.inputScore>s.outputScore).length;
    const outputStrong=filtered.filter(s=>s.gap>=18&&s.outputScore>s.inputScore).length;
    h+='<div class="adv-item"><h4>📥📤 输入输出失衡（'+gapPct+'%学生）</h4>';
    if(inputStrong>outputStrong) h+='<p>多数失衡学生为<strong>输入强于输出</strong>（'+inputStrong+'人），建议增设<strong>输出转化类作业</strong>：仿写、口头复述、造句练习。</p>';
    else h+='<p>多数失衡学生为<strong>输出强于输入</strong>（'+outputStrong+'人），建议增设<strong>输入浸泡类任务</strong>：每日阅读/听力打卡。</p>';
    h+='<div class="adv-action">二讲落地：① 输入强→弱输出的学生，安排"读后仿写"任务 ② 输出强→弱输入的学生，安排"每日20分钟听力+记录" ③ 每周跟进一次输出/输入作业完成率</div></div>';
  }

  // 4. Type concentration
  const tCount={};filtered.forEach(s=>{tCount[s.typeName]=(tCount[s.typeName]||0)+1;});
  const topType=Object.entries(tCount).sort((a,b)=>b[1]-a[1])[0];
  const topTypePct=Math.round(topType[1]/filtered.length*100);
  if(topTypePct>=40){
    h+='<div class="adv-item"><h4>👥 类型集中度</h4><p><strong>'+topTypePct+'%</strong>的学生属于<strong>'+topType[0]+'</strong>（'+topType[1]+'/'+filtered.length+'人），建议对该类型学生进行分层辅导。</p></div>';
  }

  // 5. Second weakest
  if(weakSorted.length>1){
    const secondWeak=weakSorted[1];
    const secondPct=Math.round(secondWeak[1]/filtered.length*100);
    if(secondPct>=30){
      h+='<div class="adv-item"><h4>📌 次要关注</h4><p>'+secondPct+'%的学生在<strong>'+dimCN[secondWeak[0]]+'</strong>维度为最弱项，建议在解决首要短板后重点关注。</p></div>';
    }
  }

  if(!h) h='<p style="color:var(--g400)">数据量不足，建议积累更多学生诊断后再查看教学建议</p>';
  return h;
}

function delOne(id){
  if(!confirm('确定删除这条诊断记录吗？'))return;
  db.collection(COLLECTION).doc(id).delete().then(function(){
    console.log('Deleted:', id);
  }).catch(function(e){
    console.error('Delete failed:', e);
    // Fallback: delete from local array
    allStudents = allStudents.filter(function(s){return s.id!==id;});
    localStorage.setItem('gt_eng_diag_students', JSON.stringify(allStudents));
    render();
  });
}
function clearData(){
  if(!confirm('确定清空全部诊断数据吗？此操作不可恢复。'))return;
  // Batch delete from Firestore
  var batch = db.batch();
  allStudents.forEach(function(s){
    batch.delete(db.collection(COLLECTION).doc(s.id));
  });
  batch.commit().then(function(){
    console.log('All data cleared');
  }).catch(function(e){
    console.error('Clear failed:', e);
    localStorage.removeItem('gt_eng_diag_students');
    allStudents = [];
    render();
  });
}
function exportCSV(){
  const d=allStudents;if(!d.length){alert('暂无数据');return;}
  const dims=['vocab','grammar','speed','intuition','express','adapt'];
  const dimCN=['词汇广度','语法精准度','阅读速度','语感知觉','表达意愿','学习适应'];
  let csv='﻿姓名,学段,日期,类型,输入分,输出分,落差';
  dimCN.forEach(dn=>csv+=','+dn);csv+='\n';
  d.forEach(s=>{
    csv+=[s.name,s.grade,s.date,s.typeName,s.inputScore,s.outputScore,s.gap].join(',');
    dims.forEach(k=>csv+=','+s.std[k]);csv+='\n';
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='英语画像_班级数据_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
