<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语超能力测试</title>
<style>
:root{
  --r:#E54545;--r2:#C62828;--r-light:#FFF0F0;--r-bg:#FFFBFA;
  --o:#FF8C42;--y:#FFB703;--pink:#FF6B8A;
  --g50:#fafafa;--g100:#f5f5f5;--g200:#e5e5e5;--g300:#d4d4d4;
  --g500:#737373;--g600:#525252;--g700:#404040;--g800:#262626;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--g800);background:var(--r-bg);line-height:1.6;min-height:100vh;
}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 40px}

/* Top bar */
.topbar{
  background:var(--r);color:#fff;padding:20px 24px;text-align:center;
  border-radius:0 0 24px 24px;position:relative;overflow:hidden;
}
.topbar::after{
  content:'⭐ ✨ 💫';
  position:absolute;top:8px;right:16px;
  font-size:.7em;opacity:.5;letter-spacing:4px;
}
.topbar h1{font-size:1.4em;letter-spacing:1px}
.topbar .by{font-size:.75em;opacity:.8;margin-top:2px}

/* Mascot */
.mascot{text-align:center;font-size:3em;margin:12px 0;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* Screen */
.scr{display:none;animation:fadeIn .4s}
.scr.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Card */
.card{
  background:#fff;border-radius:20px;border:2px solid #FFE0E0;
  padding:28px 24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(229,69,69,.06);
}

/* Welcome */
.welcome-icon{font-size:3em;text-align:center;margin-bottom:8px}
.welcome-text{text-align:center;font-size:1.1em;font-weight:600;color:var(--g700);margin-bottom:20px}

/* Input */
.input-box{
  width:100%;padding:14px 18px;border:2px solid #FFD0D0;border-radius:14px;
  font-size:1em;outline:none;text-align:center;font-family:inherit;
  transition:border .2s;
}
.input-box:focus{border-color:var(--r)}

/* Grade selector */
.grade-row{display:flex;gap:10px;margin-top:12px}
.grade-btn{
  flex:1;padding:14px 8px;border:2px solid #FFD0D0;border-radius:14px;
  background:#fff;cursor:pointer;font-size:.9em;font-weight:600;font-family:inherit;
  transition:all .2s;color:var(--g600);
}
.grade-btn:hover{border-color:var(--o);background:#FFF8F5}
.grade-btn.selected{border-color:var(--o);background:#FFF0E8;color:var(--o)}

/* Progress stars */
.stars-row{display:flex;gap:6px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.star{font-size:1.5em;opacity:.3;transition:all .3s}
.star.done{opacity:1;transform:scale(1.2)}
.star.current{opacity:.8;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* Section banner */
.sec-banner{
  text-align:center;padding:10px 16px;border-radius:12px;
  margin-bottom:16px;font-weight:600;font-size:.88em;
}
.sec-banner.scene{background:#FFF5F0;color:var(--o)}
.sec-banner.know{background:#FFF0F0;color:var(--r)}
.sec-banner.self{background:#FFFDF0;color:#C5930A}
.sec-banner.pref{background:#FFF5FA;color:var(--pink)}
.sec-banner.cog{background:#F8F0FF;color:#7C3AED}

/* Question */
.q-num{font-size:.8em;color:var(--g500);margin-bottom:4px}
.q-text{font-size:1.1em;font-weight:600;color:var(--g800);margin-bottom:18px}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;border:2px solid #FFE0E0;border-radius:16px;
  cursor:pointer;transition:all .2s;background:#fff;
  font-size:.95em;text-align:left;width:100%;font-family:inherit;color:inherit;
}
.opt:hover{transform:translateX(4px);border-color:var(--o)}
.opt .letter{
  width:36px;height:36px;border-radius:50%;background:var(--r-light);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.9em;flex-shrink:0;color:var(--r);
}
.opt.selected{border-color:var(--r);background:var(--r-light);transform:translateX(4px)}
.opt.selected .letter{background:var(--r);color:#fff}

/* Likert */
.likert-row{display:flex;gap:8px}
.likert-btn{
  flex:1;padding:14px 6px;border:2px solid #FFE0E0;border-radius:14px;
  cursor:pointer;text-align:center;font-size:.82em;font-family:inherit;
  background:#fff;transition:all .2s;
}
.likert-btn:hover{border-color:var(--o)}
.likert-btn.selected{border-color:var(--r);background:var(--r-light);font-weight:700;color:var(--r)}

/* Buttons */
.btn{
  display:inline-block;padding:14px 40px;border-radius:16px;
  font-size:1em;font-weight:700;cursor:pointer;border:none;
  transition:all .2s;font-family:inherit;
}
.btn-go{background:var(--r);color:#fff;font-size:1.05em;box-shadow:0 4px 12px rgba(229,69,69,.25)}
.btn-go:hover{background:var(--r2);transform:translateY(-2px)}
.btn-go:disabled{background:#ccc;cursor:not-allowed;box-shadow:none;transform:none}
.btn-out{background:#fff;color:var(--r);border:2px solid #FFD0D0}
.btn-out:hover{background:var(--r-light)}
.btn-row{display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap}

/* Encouragement */
.cheer{
  text-align:center;padding:20px;background:linear-gradient(135deg,#FFF5F0,#FFF0F0);
  border-radius:16px;margin-bottom:16px;font-size:1.1em;font-weight:600;color:var(--o);
}

/* ===== Report ===== */
.r-card{
  background:#fff;border-radius:24px;overflow:hidden;
  box-shadow:0 4px 20px rgba(229,69,69,.08);margin-bottom:16px;
}
.r-hero{
  background:linear-gradient(135deg,var(--r),var(--o));
  color:#fff;padding:28px 24px;text-align:center;
}
.r-hero .big-emoji{font-size:3.5em;display:block;margin-bottom:8px}
.r-hero h2{font-size:1.2em;margin-bottom:4px}
.r-hero .type-tag{
  display:inline-block;background:rgba(255,255,255,.2);
  padding:4px 16px;border-radius:12px;font-size:.85em;margin-top:4px;
}
.r-body{padding:24px}

.r-section{margin-bottom:20px}
.r-section:last-child{margin-bottom:0}
.r-section h3{font-size:1em;color:var(--g700);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.r-section h3 .emj{font-size:1.3em}

/* Simple bars */
.sbar{margin:8px 0}
.sbar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.sbar-label{width:90px;font-size:.82em;text-align:right;flex-shrink:0;color:var(--g600)}
.sbar-track{flex:1;height:18px;background:var(--g100);border-radius:9px;overflow:hidden}
.sbar-fill{height:100%;border-radius:9px;transition:width .8s}
.sbar-num{width:36px;font-size:.82em;font-weight:700;text-align:center;flex-shrink:0}
.sbar-emoji{font-size:.9em;width:28px;text-align:left;flex-shrink:0}

/* Strength card */
.strength-card{
  background:linear-gradient(135deg,#FFF5F0,#FFFDF5);
  border-radius:14px;padding:16px 18px;margin:8px 0;
  border:1px solid #FFE8D0;
}
.strength-card h4{font-size:.9em;color:var(--o);margin-bottom:4px}

/* Tips */
.tip-card{
  background:var(--r-light);border-radius:14px;padding:16px 18px;margin:8px 0;
  border-left:4px solid var(--r);
}
.tip-card h4{font-size:.9em;color:var(--r);margin-bottom:4px}

/* Celebration */
.confetti{text-align:center;font-size:2em;padding:16px;animation:popIn .6s}
@keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

.muted{font-size:.8em;color:var(--g500);text-align:center;margin-top:8px}
</style>
</head>
<body>

<div class="topbar">
  <h1>🪞 英语学习镜子</h1>
  <div class="by">照一照，看看你的英语长什么样</div>
</div>

<div class="wrap">

<!-- ====== WELCOME ====== -->
<div class="scr active" id="scr-welcome">
  <div class="card" style="text-align:center">
    <div class="mascot">🪞</div>
    <div class="welcome-text">这不是考试，是一面镜子</div>
    <p style="color:var(--g500);font-size:.9em;margin-bottom:6px;line-height:1.7">
      没有标准答案，也不打分排名<br>
      你越<strong style="color:var(--r)">真实</strong>，镜子里的自己就越<strong style="color:var(--r)">清楚</strong>
    </p>
    <p style="color:var(--g500);font-size:.82em;margin-bottom:18px;line-height:1.7">
      做完后你会拿到两样东西：<br>
      🧩 一份属于你的 <strong>英语学习画像</strong><br>
      🗺️ 一份专属的 <strong>行动小指南</strong>
    </p>
    <p style="color:var(--g400);font-size:.75em;margin-bottom:16px">⏱ 大概15分钟 · 诚实回答就好</p>
    <input type="text" class="input-box" id="stuName" placeholder="先告诉我你的名字吧~" style="max-width:300px">
    <p style="color:var(--g500);font-size:.8em;margin-top:10px">你现在是几年级？</p>
    <div class="grade-row" style="max-width:360px;margin:8px auto">
      <button class="grade-btn" onclick="pickGrade('小升初衔接',this)">小升初</button>
      <button class="grade-btn" onclick="pickGrade('初一',this)">初一</button>
      <button class="grade-btn" onclick="pickGrade('初二',this)">初二</button>
    </div>
    <input type="hidden" id="stuGrade" value="">
    <div class="btn-row" style="margin-top:18px">
      <button class="btn btn-go" id="btnStart" disabled onclick="start()">开始闯关 🚀</button>
    </div>
  </div>
</div>

<!-- ====== QUIZ ====== -->
<div class="scr" id="scr-quiz">
  <div class="stars-row" id="starsRow"></div>
  <div class="card">
    <div id="secBanner" class="sec-banner"></div>
    <div id="qContent"></div>
    <div id="optArea"></div>
    <div class="btn-row">
      <button class="btn btn-go" id="btnNext" disabled onclick="nextQ()">继续 →</button>
    </div>
  </div>
</div>

<!-- ====== CHEER ====== -->
<div class="scr" id="scr-cheer">
  <div class="card" style="text-align:center">
    <div class="confetti">🎉</div>
    <h2 style="color:var(--r);margin-bottom:8px">太棒了！</h2>
    <p style="color:var(--g600);font-size:1em" id="cheerMsg"></p>
    <div class="btn-row">
      <button class="btn btn-go" onclick="continueAfterCheer()">继续 →</button>
    </div>
  </div>
</div>

<!-- ====== RESULTS ====== -->
<div class="scr" id="scr-results">
  <div id="reportWrap"></div>
  <div id="saveStatus" style="text-align:center;padding:14px 20px;margin:16px 0;border-radius:14px;font-size:.88em;font-weight:600;display:none"></div>
  <div class="btn-row" style="margin-top:18px">
    <button class="btn btn-out" onclick="restart()">🔄 再测一次</button>
  </div>
  <div class="muted" id="legacyMsg">你的报告已自动保存，老师可以看到哦</div>
</div>

</div><!-- wrap -->


<script>
// ==================== CONFIG ====================
// ⚠ 部署时请将下面的 URL 替换为你的 Google Apps Script Web App URL
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby5YXzKEO-wvloprePIOO9ba4A8Pj11oHDQ9H-uLtHOqMJXvyVia-5I_rSzprh4j4Hm/exec';
// =================================================

// ==================== STATE ====================
let stuName='',stuGrade='',currentQ=0,selectedOpt=-1,inCognitive=false;
let dimSum={vocab:0,grammar:0,speed:0,intuition:0,express:0,adapt:0};
let dimCount={vocab:0,grammar:0,speed:0,intuition:0,express:0,adapt:0};
let answers=[],cogData=[],stylePrefs=[],readingStart=0,questionOrder=[],adaptiveBuilt=false;

// Cheer messages between sections
const cheerMsgs=[
  '第一部分完成啦！<br>接下来看看你的英语小技能~',
  '真厉害！<br>还有最后几个问题就完成了~',
  '最后一关！<br>这次没有标准答案，选你喜欢的就好~'
];
let cheerIdx=0;

// ==================== WELCOME ====================
function pickGrade(g,el){
  document.getElementById('stuGrade').value=g;
  document.querySelectorAll('.grade-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btnStart').disabled=!(document.getElementById('stuName').value.trim()&&g);
}
document.getElementById('stuName').addEventListener('input',function(){
  document.getElementById('btnStart').disabled=!(this.value.trim()&&document.getElementById('stuGrade').value);
});

// ==================== QUESTIONS ====================
const questions=[
  // 情景判断 (3)
  {id:1,section:'scene',sectionName:'聊聊你的习惯',
    q:'读英语文章时遇到不认识的单词，你通常会？',
    o:['猜一下意思，继续读下去','马上查字典或问人','跳过，继续往下读','有点烦，不太想继续读了'],
    s:[{adapt:2,speed:1},{adapt:-1,speed:-1},{adapt:1},{adapt:-2,express:-2}]},
  {id:2,section:'scene',
    q:'英语课上老师说"谁来用英语回答"，你通常会？',
    o:['主动举手，想试试！','心里有答案，但不太想举手','低头，希望别叫我','简单的就举手，难的就算了'],
    s:[{express:3},{express:-1},{express:-2},{express:1,adapt:1}]},
  {id:3,section:'scene',
    q:'做英语听力时有一段没听懂，你通常会？',
    o:['继续听，抓住后面能懂的部分','卡住了，反复想刚才那段','算了，后面随便选选','根据听懂的部分猜整体意思'],
    s:[{adapt:2,speed:1},{adapt:-2,speed:-1},{adapt:-1,express:-1},{adapt:1,speed:1}]},

  // 知识点理解 (6)
  {id:4,section:'know',sectionName:'单词小达人',
    q:'哪个词和"happy"意思最接近？',
    o:['sad（伤心的）','glad（高兴的）','angry（生气的）','tired（累的）'],
    correct:1,s:[{vocab:-1},{vocab:3},{vocab:-1},{vocab:-1}]},
  {id:5,section:'know',
    q:'下面哪个句子是对的？',
    o:['She go to school every day.','She goes to school every day.','She going to school every day.','She is go to school every day.'],
    correct:1,s:[{grammar:-1,intuition:-1},{grammar:3,intuition:1},{grammar:-1},{grammar:-2,intuition:-1}]},
  {id:6,section:'know',
    q:'"There is ___ apple on the table." 空格里应该填？',
    o:['a','an','the','什么都不填'],
    correct:1,s:[{grammar:-1,intuition:-1},{grammar:3,intuition:1},{grammar:-1},{grammar:-2}]},
  {id:7,section:'know',
    q:'"She ___ to Beijing last week." 应该选？',
    o:['go','goes','went','going'],
    correct:2,s:[{grammar:-1},{grammar:-1,intuition:-1},{grammar:3,intuition:1},{grammar:-2}]},
  {id:8,section:'know',
    q:'哪个句子读起来最自然？',
    o:['I very much like English.','I like English very much.','Very much I like English.','I like very much English.'],
    correct:1,s:[{intuition:-1},{intuition:3},{grammar:-1,intuition:-2},{grammar:-1,intuition:-2}]},
  {id:9,section:'know',sectionName:'阅读小高手',
    q:'读一读，回答问题：<br><br><span style="background:#FFF8F5;padding:12px 16px;display:block;border-radius:12px;font-size:.9em">My name is Tom. I am 12 years old. I like playing basketball and reading books. My favorite subject is English because my English teacher is very kind.</span><br>Tom为什么喜欢英语？',
    o:['因为英语很简单','因为他的英语老师很和蔼','因为他喜欢看书','因为他想当老师'],
    correct:1,s:[{speed:-1},{speed:3},{speed:-1},{speed:-1}]},

  // 自我评估 Likert (4)
  {id:10,section:'self',sectionName:'你觉得自己怎么样',
    q:'你觉得自己的英语阅读能力怎么样？',
    o:['非常差','比较差','一般','比较好','非常好'],
    likert:true,dim:'express',lm:[-2,-1,0,1,2]},
  {id:11,section:'self',
    q:'如果让你用英语写一段话介绍自己，你愿意试试吗？',
    o:['完全不愿意','不太愿意','一般般','比较愿意','非常愿意！'],
    likert:true,dim:'express',lm:[-2,-1,0,1,2]},
  {id:12,section:'self',
    q:'遇到不认识的英语单词，你会主动猜它的意思吗？',
    o:['从来不会','很少会','有时候会','经常会','每次都会'],
    likert:true,dim:'adapt',lm:[-2,-1,0,1,2]},
  {id:13,section:'self',
    q:'你觉得通过努力，你的英语能越来越好吗？',
    o:['完全不可能','不太可能','有可能','很有可能','一定可以！'],
    likert:true,dim:'adapt',lm:[-2,-1,0,1,2]},
  {id:16,section:'self',
    q:'你觉得自己的单词量够看懂英语短文吗？',
    o:['完全不够','不太够','一般般','基本够用','完全够用！'],
    likert:true,dim:'vocab',lm:[-2,-1,0,1,2]},
  {id:17,section:'self',
    q:'写英语句子时，你对语法规则有把握吗？',
    o:['完全没有','不太有','一般般','比较有','非常有把握！'],
    likert:true,dim:'grammar',lm:[-2,-1,0,1,2]},
  {id:18,section:'self',
    q:'读英语文章时，你觉得自己读得快吗？',
    o:['非常慢','比较慢','一般','比较快','非常快'],
    likert:true,dim:'speed',lm:[-2,-1,0,1,2]},
  {id:19,section:'self',
    q:'不看语法书，凭感觉判断一个英文句子"对不对、顺不顺"，你有把握吗？',
    o:['完全没把握','不太有把握','一般般','比较有把握','非常有把握！'],
    likert:true,dim:'intuition',lm:[-2,-1,0,1,2]},

  // 偏好配对 (2)
  {id:14,section:'pref',sectionName:'你喜欢怎么学',
    q:'你觉得哪种方式帮你记单词最有效？',
    o:['反复抄写，写多了就记住了','大声读出来，读出声记得牢','放到句子里用，用过就不会忘','看图、联想、编故事来记'],
    styles:['动觉型','听觉型','语境型','图像联想型']},
  {id:15,section:'pref',
    q:'在英语课上，你最喜欢哪种活动？',
    o:['角色扮演、和同学对话','听老师讲知识点','自己安静读故事','做游戏、小组比赛'],
    styles:['社交型','结构型','独立型','竞争型']}
];

const cogQ={
  q:'🤔 你刚才是怎么选出答案的？',
  o:['我记得规则或单词意思','读起来顺口，感觉对了','排除了不太像的选项','不太确定，猜的~'],
  types:['rule','intuition','strategy','guess']
};

// Section break indices (questions index where cheer should appear)
const cheerPoints=[3,9,17]; // After scene(3q), knowledge(6q+cog), self(8q)

// ==================== QUIZ ENGINE ====================
function start(){
  stuName=document.getElementById('stuName').value.trim();
  stuGrade=document.getElementById('stuGrade').value;
  currentQ=0;selectedOpt=-1;inCognitive=false;cheerIdx=0;adaptiveBuilt=false;
  dimSum={vocab:0,grammar:0,speed:0,intuition:0,express:0,adapt:0};
  dimCount={vocab:0,grammar:0,speed:0,intuition:0,express:0,adapt:0};
  answers=[];cogData=[];stylePrefs=[];
  questionOrder=questions.map((_,i)=>i);
  switchScr('scr-quiz');
  let starsHTML='';
  questionOrder.forEach((qi,i)=>{
    const q=questions[qi];
    if(q.section==='scene') starsHTML+='<span class="star" id="star'+i+'">⭐</span>';
    else if(q.section==='know') starsHTML+='<span class="star" id="star'+i+'">💎</span>';
    else if(q.section==='self') starsHTML+='<span class="star" id="star'+i+'">💬</span>';
    else starsHTML+='<span class="star" id="star'+i+'">❤️</span>';
  });
  document.getElementById('starsRow').innerHTML=starsHTML;
  renderQ();
}

function switchScr(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='scr-results') window.scrollTo(0,0);
}

function renderQ(){
  document.getElementById('btnNext').textContent='继续 →';
  const q=questions[questionOrder[currentQ]];if(!q)return showResults();
  selectedOpt=-1;inCognitive=false;
  updateStars();

  const banner=document.getElementById('secBanner');
  const bMap={scene:['scene','📋 '+q.sectionName],know:['know','✏️ '+q.sectionName],self:['self','💬 '+q.sectionName],pref:['pref','❤️ '+q.sectionName]};
  banner.className='sec-banner '+bMap[q.section][0];
  banner.textContent=bMap[q.section][1];

  let content='<div class="q-num">第 '+(currentQ+1)+' / '+questionOrder.length+' 题</div>';
  content+='<div class="q-text">'+q.q+'</div>';
  document.getElementById('qContent').innerHTML=content;

  const area=document.getElementById('optArea');area.innerHTML='';
  document.getElementById('btnNext').disabled=true;

  if(q.likert){
    area.innerHTML='<div class="likert-row"></div>';
    const row=area.querySelector('.likert-row');
    q.o.forEach((o,i)=>{
      const b=document.createElement('button');b.className='likert-btn';b.textContent=o;
      b.onclick=function(){row.querySelectorAll('.likert-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedOpt=i;document.getElementById('btnNext').disabled=false;};
      row.appendChild(b);
    });
  }else{
    area.className='opts';
    q.o.forEach((o,i)=>{
      const btn=document.createElement('button');btn.className='opt';
      btn.innerHTML='<span class="letter">'+'ABCD'[i]+'</span><span>'+o+'</span>';
      btn.onclick=function(){area.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');selectedOpt=i;document.getElementById('btnNext').disabled=false;};
      area.appendChild(btn);
    });
  }
  if(q.id===9) readingStart=Date.now();
}

function updateStars(){
  document.querySelectorAll('.star').forEach((s,i)=>{
    s.classList.remove('done','current');
    if(i<currentQ) s.classList.add('done');
    else if(i===currentQ) s.classList.add('current');
  });
}

function calcProvisionalScores(){
  const raw={},std={};
  Object.keys(dimSum).forEach(k=>{raw[k]=dimCount[k]>0?dimSum[k]/dimCount[k]:0;});
  Object.keys(raw).forEach(k=>{std[k]=Math.max(10,Math.min(98,Math.round(50+raw[k]*12)));});
  return std;
}
function buildAdaptiveQueue(){
  const prov=calcProvisionalScores();
  const sorted=Object.entries(prov).sort((a,b)=>a[1]-b[1]);
  const weakDims=new Set([sorted[0][0],sorted[1][0]]);
  const tail=questionOrder.slice(currentQ);
  tail.sort((a,b)=>{
    const qa=questions[a],qb=questions[b];
    const aW=qa.dim&&weakDims.has(qa.dim)?1:0;
    const bW=qb.dim&&weakDims.has(qb.dim)?1:0;
    if(aW!==bW)return bW-aW;
    return qa.section==='pref'?1:qb.section==='pref'?-1:0;
  });
  questionOrder=[...questionOrder.slice(0,currentQ),...tail];
}

function nextQ(){
  const q=questions[questionOrder[currentQ]];

  if(!inCognitive && q.section==='know'){
    const correct=selectedOpt===q.correct;
    answers.push({qid:q.id,type:'knowledge',answer:selectedOpt,correct});
    const sig=q.s[selectedOpt];
    if(sig) Object.keys(sig).forEach(k=>{dimSum[k]+=sig[k];dimCount[k]++;});
    if(q.id===9){const rt=(Date.now()-readingStart)/1000;if(rt>45)dimSum.speed-=2;else if(rt>30)dimSum.speed-=1;else if(rt<15)dimSum.speed+=1;dimCount.speed++;}
    inCognitive=true;renderCog();return;
  }
  if(inCognitive && q.section==='know'){
    const ct=cogQ.types[selectedOpt];
    const prevA=answers[answers.length-1];
    cogData.push({qid:q.id,correct:prevA.correct,cogType:ct});
    if(prevA.correct&&ct==='rule'){dimSum.grammar+=1;dimCount.grammar++;}
    else if(prevA.correct&&ct==='intuition'){dimSum.intuition+=1;dimCount.intuition++;dimSum.speed+=1;dimCount.speed++;}
    else if(!prevA.correct&&ct==='rule'){dimSum.grammar-=1;dimCount.grammar++;}
    else if(!prevA.correct&&ct==='intuition'){dimSum.intuition-=1;dimCount.intuition++;}
    inCognitive=false;currentQ++;
    if(!adaptiveBuilt&&currentQ>=9){buildAdaptiveQueue();adaptiveBuilt=true;}
    if(currentQ>=questionOrder.length){showResults();return;}
    if(cheerPoints.includes(currentQ)){document.getElementById('cheerMsg').innerHTML=cheerMsgs[cheerIdx];cheerIdx++;switchScr('scr-cheer');return;}
    renderQ();return;
  }

  // Non-knowledge
  if(q.section==='scene'){
    answers.push({qid:q.id,type:'scenario',answer:selectedOpt});
    const sig=q.s[selectedOpt];
    if(sig) Object.keys(sig).forEach(k=>{dimSum[k]+=sig[k];dimCount[k]++;});
  }else if(q.section==='self'){
    answers.push({qid:q.id,type:'self',answer:selectedOpt});
    dimSum[q.dim]+=q.lm[selectedOpt];dimCount[q.dim]++;
  }else if(q.section==='pref'){
    answers.push({qid:q.id,type:'preference',answer:selectedOpt,style:q.styles[selectedOpt]});
    stylePrefs.push(q.styles[selectedOpt]);
  }

  currentQ++;
  if(currentQ>=questionOrder.length){showResults();return;}
  if(cheerPoints.includes(currentQ)){document.getElementById('cheerMsg').innerHTML=cheerMsgs[cheerIdx];cheerIdx++;switchScr('scr-cheer');return;}
  renderQ();
}

function continueAfterCheer(){switchScr('scr-quiz');renderQ();}

function renderCog(){
  const q=questions[questionOrder[currentQ]];
  document.getElementById('secBanner').className='sec-banner cog';document.getElementById('secBanner').textContent='🤔 想一想';
  document.getElementById('qContent').innerHTML='<div class="q-num">追问</div><div class="q-text">'+cogQ.q+'</div>';
  const area=document.getElementById('optArea');area.className='opts';area.innerHTML='';
  cogQ.o.forEach((o,i)=>{
    const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML='<span class="letter">'+'ABCD'[i]+'</span><span>'+o+'</span>';
    btn.onclick=function(){area.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');selectedOpt=i;document.getElementById('btnNext').disabled=false;};
    area.appendChild(btn);
  });
  document.getElementById('btnNext').textContent='选好了 →';
  document.getElementById('btnNext').disabled=true;
}

// ==================== SCORING ====================
function calcScores(){
  const raw={},std={};
  Object.keys(dimSum).forEach(k=>{raw[k]=dimCount[k]>0?dimSum[k]/dimCount[k]:0;});
  Object.keys(raw).forEach(k=>{std[k]=Math.max(10,Math.min(98,Math.round(50+raw[k]*12)));});
  const inputScore=Math.round(std.vocab*0.35+std.speed*0.35+std.intuition*0.30);
  const outputScore=Math.round(std.grammar*0.4+std.express*0.6);
  return{raw,std,inputScore,outputScore};
}

function classifyType(std,inputScore,outputScore){
  const gap=Math.abs(inputScore-outputScore);
  const{vocab:v,grammar:g,speed:sp,intuition:i,express:e,adapt:a}=std;
  const all=Object.values(std);
  const avg=all.reduce((x,y)=>x+y,0)/6;
  const sorted=Object.entries(std).sort((a,b)=>a[1]-b[1]);
  const wk=sorted[0],st=sorted[5];
  // All-around strong
  if(all.every(x=>x>=65)) return{id:'all_high',name:'全能小超人',icon:'🦸',desc:'你的英语各方面都很棒！听说读写样样在行，继续保持这样的状态！',color:'#E54545'};
  // All-around developing
  if(all.every(x=>x<45)) return{id:'all_low',name:'成长小苗',icon:'🌱',desc:'你的英语正在慢慢发芽，每个人都是从这一步开始的。别着急，一步一步来，你会看到自己的进步！',color:'#FF8C42'};
  // Input-output gap — 核心诊断信号
  if(gap>=18&&inputScore>outputScore) return{id:'input_strong',name:'输入强势型',icon:'🔍',desc:'你读得懂、听得明，但说和写还需要加把劲。你的输入能力是你的超能力，现在要把这股能量传递到输出端！',color:'#3B7CFF'};
  if(gap>=18&&outputScore>inputScore) return{id:'output_strong',name:'输出强势型',icon:'📢',desc:'你敢说敢写，超有勇气！接下来多读多听，让你的表达变得更准确、更地道。',color:'#FF6B8A'};
  // Classify by weakest dimension
  const weakGap=avg-wk[1];
  if(weakGap>=7){
    var typeMap={
      vocab:{id:'weak_vocab',name:'词汇探险家',icon:'📚',desc:'你认识的词还不够多，但这正是进步空间最大的地方！每天认识几个新朋友（单词），很快你就能读更多、懂更多。',color:'#3B7CFF'},
      grammar:{id:'weak_grammar',name:'语法小工匠',icon:'🏗️',desc:'语法规则还在搭建中，写句子时偶尔会迷路。没关系，语法是"长"进脑子里的，多读多练自然就通了。',color:'#B45309'},
      speed:{id:'weak_speed',name:'慢读小蜗牛',icon:'🐌',desc:'你读英语的速度偏慢，可能在逐词翻译。蜗牛虽慢但总能到达终点——多读多练，你会越来越快的！',color:'#FF6B35'},
      intuition:{id:'weak_intuition',name:'语感萌芽中',icon:'💡',desc:'你对英语"对不对"的感觉还在生长中。多听多读，让正确的英语像音乐一样流进你的耳朵，语感会慢慢长出来的。',color:'#7C3AED'},
      express:{id:'weak_express',name:'害羞小话筒',icon:'🎤',desc:'你不太敢开口说英语，可能怕犯错。但其实说错了改过来才是进步最快的方式——勇敢说出来，你就已经赢了一半！',color:'#DB2777'},
      adapt:{id:'weak_adapt',name:'谨慎小船长',icon:'🧭',desc:'遇到不认识的词或不懂的内容时容易紧张。学英语的路上"不完全懂"太正常了，学会和它相处，你会航行得更远。',color:'#0D9488'}
    };
    return typeMap[wk[0]];
  }
  // Balanced — 各维度差距不大
  return{id:'balanced',name:'均衡小战士',icon:'⭐',desc:'你的英语各方面发展比较均衡，没有明显的短板。继续全面发展，找到自己最感兴趣的方向深入下去！',color:'#E54545'};
}

// ---- Dimension-level comments ----

function buildActionPlan(std,type,weakK,strongK,gap){
  const plans=[];
  // Priority 1: weakest dimension
  const a1={
    vocab:{title:'每天积累8个词',desc:'早上学4个新词，晚上复习。用新词造一个跟自己生活有关的句子（比如"I ate noodles today"），写在专门的"单词小本本"上。'},
    grammar:{title:'每天对比5个句子',desc:'找一对正确和错误的句子（比如"She goes" vs "She go"），读出来感受哪个对、为什么。一周后你会发现自己对语法"有感觉了"。'},
    speed:{title:'每天1篇限时阅读',desc:'找80词左右的短文，计时读。第一遍不限时，第二遍控制在3分钟内。重点不是全对，是练习"不翻译直接理解"。'},
    intuition:{title:'每天15分钟英语浸泡',desc:'选你喜欢的——听英文歌看歌词、看5分钟英文动画、跟读课文。不求100%听懂，泡着就行，语感是"泡"出来的。'},
    express:{title:'每天写1句英语',desc:'不用多，就1句。内容随便——今天干了啥、心情怎么样、吐槽天气都行。先坚持10天，不纠错，只管写。'},
    adapt:{title:'每天猜1个生词',desc:'在阅读中遇到不认识的词，先别查，根据上下文猜。猜完再查。慢慢你会发现"猜对"的概率其实很高。'}
  };
  plans.push(a1[weakK]||a1.vocab);

  // Priority 2: leverage strength
  if(strongK!==weakK){
    const a2={
      vocab:{title:'用你的词汇量读更多',desc:'既然认识的词不少，就多读！选稍难一点的材料，利用已有的词汇去"攻克"新内容，在读的过程中顺便拓展新词。'},
      grammar:{title:'写完后自己检查一遍',desc:'利用你对语法的敏感度，写完英语句子后花30秒"自查"。你有能力发现大部分错误——这个检查过程本身就是最好的练习。'},
      speed:{title:'用速度优势积累语感',desc:'既然读得快，就多读。每天多读1-2篇短文，量的积累会自然带动词汇和语感的提升。'},
      intuition:{title:'试试"反向总结"',desc:'从你觉得顺口的句子中，自己总结语法规律。比如从"I like / She likes"中自己发现"三单要加s"——用归纳法对你这种语感型学习者特别有效。'},
      express:{title:'保护你的表达勇气',desc:'这是你最宝贵的资本。每次写完说完之后，先想"我哪里表达对了"，再想"哪里可以更好"——顺序很重要。'},
      adapt:{title:'挑战更难的材料',desc:'既然你不怕陌生的内容，就去读一些原汁原味的东西——英文绘本、简单新闻、歌词——你的适应能力会让你进步得比别人快。'}
    };
    plans.push(a2[strongK]||a2.vocab);
  }

  // Priority 3: if input-output gap
  if(gap>=18&&type.id==='input_strong'){
    plans.push({title:'把"读懂"变成"写出"',desc:'用你读过的短文做仿写：把原文的主角名字换掉、动词改一下人称、加一个形容词。这就是在"输出"了，而且不费劲。'});
  }

  return plans;
}

async function getPreviousRecord(){
  try{
    const resp = await fetch(APPS_SCRIPT_URL + '?action=history&name=' +
      encodeURIComponent(stuName) + '&grade=' + encodeURIComponent(stuGrade));
    const data = await resp.json();
    if (data && data.name) {
      // Reconstruct std object from flat fields
      data.std = {
        vocab: data.vocab, grammar: data.grammar, speed: data.speed,
        intuition: data.intuition, express: data.express, adapt: data.adapt
      };
      data.type = data.typeId;
      return data;
    }
    return null;
  }catch(e){
    console.error('Query failed, using localStorage fallback:',e);
    try {
      const students=JSON.parse(localStorage.getItem('gt_eng_diag_students')||'[]');
      const mine=students.filter(s=>s.name===stuName&&s.grade===stuGrade);
      return mine.length>0?mine[mine.length-1]:null;
    } catch(e2) {
      console.error('LocalStorage fallback also failed:', e2);
      return null;
    }
  }
}

async function saveToStorage(std,inputScore,outputScore,gap,type){
  const data={
    name:stuName,grade:stuGrade,
    date:new Date().toISOString().slice(0,10),
    vocab:std.vocab, grammar:std.grammar, speed:std.speed,
    intuition:std.intuition, express:std.express, adapt:std.adapt,
    inputScore,outputScore,gap,
    typeId:type.id, typeName:type.name, typeIcon:type.icon,
    weakKey:Object.entries(std).sort((a,b)=>a[1]-b[1])[0][0],
    strongKey:Object.entries(std).sort((a,b)=>a[1]-b[1]).reverse()[0][0],
    cogData:JSON.stringify(cogData),
    stylePrefs:JSON.stringify(stylePrefs),
    timestamp:new Date().toISOString()
  };

  // Always save to localStorage first (so teacher can always read it)
  saveToLocalStorage(data);

  try {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await resp.json();
    if (result && result.success) {
      console.log('✅ Saved to Apps Script, row:', result.row);
      return { success: true, server: true, row: result.row };
    }
    // Server returned an error
    throw new Error(result.error || 'Server returned non-success');
  } catch(e) {
    console.warn('⚠️ Submit to server failed, kept in local storage:', e.message);
    // Already saved locally above, just queue for retry
    queueForRetry(data);
    return { success: false, local: true, error: e.message };
  }
}

function saveToLocalStorage(data) {
  const key = 'gt_eng_diag_students';
  var students = [];
  try { students = JSON.parse(localStorage.getItem(key) || '[]'); } catch(_) { students = []; }
  // Avoid duplicate entries (same name + grade + date)
  var exists = students.some(function(s) {
    return s.name === data.name && s.grade === data.grade && s.date === data.date;
  });
  if (!exists) {
    students.push(data);
    try { localStorage.setItem(key, JSON.stringify(students)); } catch(_) {}
  }
}

function queueForRetry(data) {
  const pqKey = 'gt_eng_diag_pending';
  var pending = [];
  try { pending = JSON.parse(localStorage.getItem(pqKey) || '[]'); } catch(_) { pending = []; }
  var exists = pending.some(function(p) {
    return p.name === data.name && p.grade === data.grade && p.date === data.date;
  });
  if (!exists) {
    pending.push(data);
    try { localStorage.setItem(pqKey, JSON.stringify(pending)); } catch(_) {}
  }
}

function showSaveStatus(state){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.style.display = 'block';
  switch(state){
    case 'saving':
      el.style.background = '#FFFDF5';
      el.style.color = '#B45309';
      el.innerHTML = '⏳ 正在保存你的诊断报告...';
      break;
    case 'success':
      el.style.background = '#F0FDF4';
      el.style.color = '#16A34A';
      el.innerHTML = '✅ 报告已保存成功，老师可以看到啦！';
      break;
    case 'local':
      el.style.background = '#FFF8F5';
      el.style.color = '#FF8C42';
      el.innerHTML = '💾 报告已保存在本地，联网后将自动同步给老师';
      break;
    case 'error':
      el.style.background = '#FEF2F2';
      el.style.color = '#E54545';
      el.innerHTML = '❌ 保存失败，请检查网络后刷新页面重试';
      break;
  }
}

// Retry pending submissions on page load
(function flushPending(){
  const pqKey='gt_eng_diag_pending';
  let pending=[];
  try { pending = JSON.parse(localStorage.getItem(pqKey)||'[]'); } catch(_){}
  if(!pending.length) return;
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(pending[0])
  }).then(r => r.json()).then(() => {
    pending.shift();
    localStorage.setItem(pqKey, JSON.stringify(pending));
    if(pending.length) flushPending();
  }).catch(() => { /* leave for next page load */ });
})();

  document.querySelectorAll('.grade-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('btnStart').disabled=true;
