<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中英语准备度评估</title>
<style>
:root{
  --r:#E54545;--r2:#C62828;--r-light:#FFF0F0;--r-bg:#FFFCFC;
  --blue:#3B7CFF;--teal:#0D9488;--purple:#7C3AED;
  --g50:#fafafa;--g100:#f5f5f5;--g200:#e5e5e5;--g300:#d4d4d4;
  --g400:#a3a3a3;--g500:#737373;--g600:#525252;--g700:#404040;--g800:#262626;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--g800);background:var(--r-bg);line-height:1.7;min-height:100vh;
}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 40px}

/* Topbar */
.topbar{
  background:linear-gradient(135deg,var(--r),#a52020);
  color:#fff;padding:22px 24px;text-align:center;
  border-radius:0 0 20px 20px;
}
.topbar h1{font-size:1.25em;letter-spacing:1px;font-weight:700}
.topbar .by{font-size:.75em;opacity:.75;margin-top:2px}

/* Screen */
.scr{display:none;animation:fadeIn .4s}
.scr.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Card */
.card{
  background:#fff;border-radius:16px;border:1px solid #F0D0D0;
  padding:28px 24px;margin-bottom:16px;
}

/* Welcome */
.welcome-lead{text-align:center;font-size:1.05em;font-weight:600;color:var(--g700);margin-bottom:6px}
.welcome-sub{text-align:center;color:var(--g500);font-size:.88em;margin-bottom:20px;line-height:1.8}

/* Input */
.input-box{
  width:100%;padding:14px 18px;border:2px solid #E8D0D0;border-radius:12px;
  font-size:1em;outline:none;text-align:center;font-family:inherit;
  transition:border .2s;
}
.input-box:focus{border-color:var(--r)}

/* Grade selector */
.grade-row{display:flex;gap:10px;margin-top:12px}
.grade-btn{
  flex:1;padding:14px 8px;border:2px solid #E8D0D0;border-radius:12px;
  background:#fff;cursor:pointer;font-size:.9em;font-weight:600;font-family:inherit;
  transition:all .2s;color:var(--g600);
}
.grade-btn:hover{border-color:var(--r)}
.grade-btn.selected{border-color:var(--r);background:var(--r-light);color:var(--r)}

/* Progress */
.prog-row{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.prog-dot{width:12px;height:12px;border-radius:50%;background:var(--g200);transition:all .3s}
.prog-dot.done{background:var(--r)}
.prog-dot.current{background:var(--r);box-shadow:0 0 0 4px rgba(229,69,69,.2)}

/* Section banner */
.sec-banner{
  text-align:center;padding:8px 16px;border-radius:10px;
  margin-bottom:14px;font-weight:600;font-size:.84em;
}
.sec-banner.scene{background:#FFF5F0;color:#D97706}
.sec-banner.know{background:var(--r-light);color:var(--r)}
.sec-banner.self{background:#FFFDF0;color:#B45309}
.sec-banner.pref{background:#F8F0FF;color:#7C3AED}
.sec-banner.cog{background:#F0F4FF;color:var(--blue)}

/* Question */
.q-num{font-size:.78em;color:var(--g400);margin-bottom:4px}
.q-text{font-size:1.08em;font-weight:600;color:var(--g800);margin-bottom:18px}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;border:2px solid #F0D0D0;border-radius:14px;
  cursor:pointer;transition:all .2s;background:#fff;
  font-size:.93em;text-align:left;width:100%;font-family:inherit;color:inherit;
}
.opt:hover{transform:translateX(4px);border-color:var(--r)}
.opt .letter{
  width:34px;height:34px;border-radius:50%;background:var(--r-light);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.85em;flex-shrink:0;color:var(--r);
}
.opt.selected{border-color:var(--r);background:var(--r-light);transform:translateX(4px)}
.opt.selected .letter{background:var(--r);color:#fff}

/* Likert */
.likert-row{display:flex;gap:8px}
.likert-btn{
  flex:1;padding:14px 6px;border:2px solid #F0D0D0;border-radius:12px;
  cursor:pointer;text-align:center;font-size:.8em;font-family:inherit;
  background:#fff;transition:all .2s;
}
.likert-btn:hover{border-color:var(--r)}
.likert-btn.selected{border-color:var(--r);background:var(--r-light);font-weight:700;color:var(--r)}

/* Buttons */
.btn{
  display:inline-block;padding:13px 36px;border-radius:14px;
  font-size:.95em;font-weight:600;cursor:pointer;border:none;
  transition:all .2s;font-family:inherit;
}
.btn-go{background:var(--r);color:#fff;box-shadow:0 4px 12px rgba(229,69,69,.2)}
.btn-go:hover{background:var(--r2);transform:translateY(-2px)}
.btn-go:disabled{background:#ccc;cursor:not-allowed;box-shadow:none;transform:none}
.btn-out{background:#fff;color:var(--r);border:2px solid #F0D0D0}
.btn-out:hover{background:var(--r-light)}
.btn-row{display:flex;gap:10px;margin-top:18px;justify-content:center;flex-wrap:wrap}

/* Cheer */
.cheer-card{text-align:center;padding:24px;background:linear-gradient(135deg,#FFF8F5,var(--r-light));border-radius:16px;margin-bottom:16px}
.cheer-card h2{color:var(--r);margin-bottom:8px;font-size:1.15em}
.cheer-card p{color:var(--g600);font-size:.95em}

/* ===== Report ===== */
.r-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.04);margin-bottom:16px}
.r-hero{
  background:linear-gradient(135deg,#2D3748,#4A5568);
  color:#fff;padding:28px 24px;text-align:center;
}
.r-hero .big-icon{font-size:2.8em;display:block;margin-bottom:8px}
.r-hero h2{font-size:1.1em;margin-bottom:2px}
.r-hero .type-tag{
  display:inline-block;background:rgba(255,255,255,.15);
  padding:4px 16px;border-radius:10px;font-size:.82em;margin-top:4px;
}
.r-body{padding:24px}

.r-section{margin-bottom:18px}
.r-section:last-child{margin-bottom:0}
.r-section h3{font-size:.98em;color:var(--g700);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* Simple bars */
.sbar{margin:6px 0}
.sbar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.sbar-label{width:85px;font-size:.8em;text-align:right;flex-shrink:0;color:var(--g600)}
.sbar-track{flex:1;height:16px;background:var(--g100);border-radius:8px;overflow:hidden}
.sbar-fill{height:100%;border-radius:8px;transition:width .8s}
.sbar-num{width:32px;font-size:.82em;font-weight:700;text-align:center;flex-shrink:0}

/* Grow card */
.grow-card{
  background:linear-gradient(135deg,#FFFDF5,#FFF8F5);
  border-radius:12px;padding:16px 18px;margin:8px 0;
  border:1px solid #F0E8D8;
}
.grow-card h4{font-size:.9em;color:#B45309;margin-bottom:4px}

/* Guide card */
.guide-card{
  background:var(--r-light);border-radius:12px;padding:16px 18px;margin:8px 0;
  border-left:3px solid var(--r);
}
.guide-card h4{font-size:.9em;color:var(--r);margin-bottom:4px}

.muted{font-size:.78em;color:var(--g400);text-align:center;margin-top:8px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="topbar">
  <h1>高中英语 · 准备度评估</h1>
  <div class="by">了解自己，才能更好地出发</div>
</div>

<div class="wrap">

<!-- ====== WELCOME ====== -->
<div class="scr active" id="scr-welcome">
  <div class="card" style="text-align:center">
    <div style="font-size:2.5em;margin-bottom:12px">🎯</div>
    <div class="welcome-lead">这不是考试，是一面镜子</div>
    <div class="welcome-sub">
      没有标准答案，也不打分排名<br>
      你越<strong style="color:var(--r)">坦诚</strong>地面对自己，镜子里的画像就越<strong style="color:var(--r)">准确</strong>
    </div>
    <p style="color:var(--g500);font-size:.84em;margin-bottom:16px;line-height:1.8">
      中考是初中三年的终点，但更是<strong>高中英语的起点</strong><br>
      这份评估帮你看清：<br>
      🧩 你现在的英语学习<strong>是什么样的</strong><br>
      🗺️ 进入高中前，哪些方面<strong>值得多关注</strong>
    </p>
    <p style="color:var(--g400);font-size:.75em;margin-bottom:16px">大约15分钟 · 诚实作答即可</p>
    <input type="text" class="input-box" id="stuName" placeholder="你的名字" style="max-width:280px">
    <p style="color:var(--g500);font-size:.8em;margin-top:10px">当前年级</p>
    <div class="grade-row" style="max-width:320px;margin:8px auto">
      <button class="grade-btn" onclick="pickGrade('初三',this)">初三</button>
      <button class="grade-btn" onclick="pickGrade('高一',this)">高一</button>
    </div>
    <input type="hidden" id="stuGrade" value="">
    <div class="btn-row">
      <button class="btn btn-go" id="btnStart" disabled onclick="start()">开始评估</button>
    </div>
  </div>
</div>

<!-- ====== QUIZ ====== -->
<div class="scr" id="scr-quiz">
  <div class="prog-row" id="progRow"></div>
  <div class="card">
    <div id="secBanner" class="sec-banner"></div>
    <div id="qContent"></div>
    <div id="optArea"></div>
    <div class="btn-row">
      <button class="btn btn-go" id="btnNext" disabled onclick="nextQ()">继续 →</button>
    </div>
  </div>
</div>

<!-- ====== CHEER ====== -->
<div class="scr" id="scr-cheer">
  <div class="cheer-card">
    <div style="font-size:2em;margin-bottom:8px">👍</div>
    <h2>做得好</h2>
    <p id="cheerMsg"></p>
    <div class="btn-row">
      <button class="btn btn-go" onclick="continueAfterCheer()">继续 →</button>
    </div>
  </div>
</div>

<!-- ====== RESULTS ====== -->
<div class="scr" id="scr-results">
  <div id="reportWrap"></div>
  <div class="btn-row" style="margin-top:18px">
    <button class="btn btn-out" onclick="restart()">🔄 重新评估</button>
  </div>
  <div class="muted">你的评估结果已保存，老师可以看到</div>
</div>

</div><!-- wrap -->

<script>
// ==================== FIREBASE (with CDN-fail fallback) ====================
var db = null;
var firebaseAvailable = false;

try {
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp({
      apiKey: "AIzaSyCnnQmSs3TsnmuoTPOUBx-Sf4eucNVRLTQ",
      authDomain: "gaotu-diagnostic.firebaseapp.com",
      projectId: "gaotu-diagnostic",
      storageBucket: "gaotu-diagnostic.firebasestorage.app",
      messagingSenderId: "109824619609",
      appId: "1:109824619609:web:41f749de0021de4ad26d48"
    });
    db = firebase.firestore();
    firebaseAvailable = true;
    try { db.enablePersistence().catch(function(){}); } catch(_) {}
  }
} catch(e) {
  console.warn('Firebase init failed, using localStorage only:', e.message);
}

// ==================== STATE ====================
let stuName='',stuGrade='',currentQ=0,selectedOpt=-1,inCognitive=false;
let dimSum={vocab:0,grammar:0,speed:0,intuition:0,express:0,adapt:0};
let dimCount={vocab:0,grammar:0,speed:0,intuition:0,express:0,adapt:0};
let answers=[],cogData=[],stylePrefs=[],readingStart=0,questionOrder=[],adaptiveBuilt=false;
const cheerMsgs=[
  '第一部分完成了。<br>接下来看看你的语言基本功~',
  '很好，继续加油。<br>最后几个问题了~',
  '最后一组！<br>这里没有标准答案，选你真实的想法就好~'
];
let cheerIdx=0;

// ==================== WELCOME ====================
function pickGrade(g,el){
  document.getElementById('stuGrade').value=g;
  document.querySelectorAll('.grade-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btnStart').disabled=!(document.getElementById('stuName').value.trim()&&g);
}
document.getElementById('stuName').addEventListener('input',function(){
  document.getElementById('btnStart').disabled=!(this.value.trim()&&document.getElementById('stuGrade').value);
});

// ==================== QUESTIONS ====================
const questions=[
  // 情景判断 (3) — 中考备考场景
  {id:1,section:'scene',sectionName:'聊聊你的学习习惯',
    q:'做英语阅读时遇到生词，你通常怎么处理？',
    o:['根据上下文推测意思，继续往下读','立刻查词典或问同学','先标记，做完题再查','有点焦虑，会反复纠结这个词'],
    s:[{adapt:2,speed:1},{adapt:-1,speed:-1},{adapt:1},{adapt:-2,express:-2}]},
  {id:2,section:'scene',
    q:'英语课上老师请人分析一个长难句，你通常会？',
    o:['主动尝试，错了也没关系','心里有思路，但不太想第一个说','等待别人回答，自己听着','看句子难度，有把握才举手'],
    s:[{express:3},{express:-1},{express:-2},{express:1,adapt:1}]},
  {id:3,section:'scene',
    q:'做英语听力时有一段没跟上，你通常会？',
    o:['迅速调整，抓住后面能听懂的部分','有点慌，反复想刚才漏掉的内容','放弃这一段，随便选','根据已听懂的内容推测整体意思'],
    s:[{adapt:2,speed:1},{adapt:-2,speed:-1},{adapt:-1,express:-1},{adapt:1,speed:1}]},

  // 知识点理解 (6) — 中考难度
  {id:4,section:'know',sectionName:'词汇与语法',
    q:'— I find it ___ to finish so much homework in such a short time.<br>— Take it easy. You can ask your teacher for help.',
    o:['impossible','possible','possibly','impossibly'],
    correct:0,s:[{vocab:-1},{vocab:-1},{vocab:3},{vocab:-1}]},
  {id:5,section:'know',
    q:'— Where is Tom?<br>— He ___ the library. He will be back in an hour.',
    o:['has gone to','has been to','went to','goes to'],
    correct:0,s:[{grammar:-1,intuition:-1},{grammar:-1,intuition:-1},{grammar:-2},{grammar:3,intuition:1}]},
  {id:6,section:'know',
    q:'Could you tell me ___?',
    o:['where is the nearest hospital','where the nearest hospital is','where was the nearest hospital','the nearest hospital is where'],
    correct:1,s:[{grammar:-1,intuition:-1},{grammar:3,intuition:1},{grammar:-1},{grammar:-2,intuition:-1}]},
  {id:7,section:'know',
    q:'The 2024 Olympic Games ___ in Paris.',
    o:['hold','held','was held','were held'],
    correct:3,s:[{grammar:-1},{grammar:-1},{grammar:-2,intuition:-1},{grammar:3,intuition:1}]},
  {id:8,section:'know',
    q:'哪个句子读起来最自然？',
    o:['I don\'t know what does he want.','I don\'t know what he wants.','I don\'t know what he want.','I not know what he wants.'],
    correct:1,s:[{intuition:-1},{intuition:3},{grammar:-1,intuition:-2},{grammar:-2,intuition:-2}]},
  {id:9,section:'know',sectionName:'阅读理解',
    q:'读一读，回答问题：<br><br><span style="background:#F8F8F8;padding:12px 16px;display:block;border-radius:10px;font-size:.88em">According to a recent survey, teenagers who spend more than 3 hours a day on social media are twice as likely to feel anxious about their academic performance. However, when used properly — such as joining study groups or following educational content — social media can actually help students learn more effectively.</span><br>作者认为社交媒体对学习的影响是？',
    o:['完全有害','完全有益','取决于如何使用','与学习无关'],
    correct:2,s:[{speed:-1},{speed:-1},{speed:3},{speed:-2}]},

  // 自我评估 Likert (8) — 覆盖全部6个维度
  {id:10,section:'self',sectionName:'自我感知',
    q:'你觉得自己的词汇量能支撑高中英语阅读吗？',
    o:['差距还很大','不太够','基本够用','比较充足','完全没问题'],
    likert:true,dim:'vocab',lm:[-2,-1,0,1,2]},
  {id:11,section:'self',
    q:'写英语句子时，你对语法结构的把握程度如何？',
    o:['几乎没把握','不太有把握','一般','比较有把握','非常有把握'],
    likert:true,dim:'grammar',lm:[-2,-1,0,1,2]},
  {id:12,section:'self',
    q:'做英语阅读题时，你的速度感觉如何？',
    o:['经常做不完','偏慢，勉强做完','一般','比较快','非常快，常有余量'],
    likert:true,dim:'speed',lm:[-2,-1,0,1,2]},
  {id:13,section:'self',
    q:'不看语法书，凭语感判断一个句子"对不对、顺不顺"，你有把握吗？',
    o:['完全没感觉','不太有感觉','偶尔能判断','比较有把握','非常敏锐'],
    likert:true,dim:'intuition',lm:[-2,-1,0,1,2]},
  {id:14,section:'self',
    q:'你愿意用英语表达自己的想法吗（口头或书面）？',
    o:['非常抗拒','不太愿意','视情况而定','比较愿意','非常愿意'],
    likert:true,dim:'express',lm:[-2,-1,0,1,2]},
  {id:15,section:'self',
    q:'如果让你用英语写一段话介绍自己，你的感受是？',
    o:['完全不想写','有点抵触','无所谓','愿意试试','很乐意写'],
    likert:true,dim:'express',lm:[-2,-1,0,1,2]},
  {id:16,section:'self',
    q:'遇到不认识的英语单词或表达，你会主动猜测它的意思吗？',
    o:['从来不会','很少会','有时候会','经常会','每次都会'],
    likert:true,dim:'adapt',lm:[-2,-1,0,1,2]},
  {id:17,section:'self',
    q:'面对即将到来的高中英语学习，你的心态是？',
    o:['很焦虑，怕跟不上','有点担心','平常心','比较期待','非常期待，很有信心'],
    likert:true,dim:'adapt',lm:[-2,-1,0,1,2]},

  // 偏好配对 (2)
  {id:18,section:'pref',sectionName:'你的学习偏好',
    q:'你觉得哪种方式帮你记单词最有效？',
    o:['反复抄写，肌肉记忆','大声朗读，听读结合','放到句子里用，语境记忆','联想、词根词缀、编故事'],
    styles:['动觉型','听觉型','语境型','分析型']},
  {id:19,section:'pref',
    q:'在英语课上，你最喜欢哪种学习活动？',
    o:['小组讨论、角色扮演','听老师系统讲解','自己阅读、独立思考','做练习、刷题巩固'],
    styles:['社交型','结构型','独立型','练习型']}
];

const cogQ={
  q:'🤔 你刚才是怎么选出答案的？',
  o:['我记得对应的语法规则或单词用法','读起来顺口，凭感觉选的','排除了明显不对的选项','不太确定，猜的'],
  types:['rule','intuition','strategy','guess']
};

const cheerPoints=[3,9,17]; // After scene(3q), knowledge(6q+cog), self(8q)

// ==================== QUIZ ENGINE ====================
function start(){
  stuName=document.getElementById('stuName').value.trim();
  stuGrade=document.getElementById('stuGrade').value;
  currentQ=0;selectedOpt=-1;inCognitive=false;cheerIdx=0;adaptiveBuilt=false;
  dimSum={vocab:0,grammar:0,speed:0,intuition:0,express:0,adapt:0};
  dimCount={vocab:0,grammar:0,speed:0,intuition:0,express:0,adapt:0};
  answers=[];cogData=[];stylePrefs=[];
  questionOrder=questions.map((_,i)=>i);
  switchScr('scr-quiz');
  let dots='';
  questionOrder.forEach((_,i)=>{
    dots+='<span class="prog-dot" id="dot'+i+'"></span>';
  });
  document.getElementById('progRow').innerHTML=dots;
  renderQ();
}

function switchScr(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='scr-results') window.scrollTo(0,0);
}

function updateDots(){
  document.querySelectorAll('.prog-dot').forEach((d,i)=>{
    d.classList.remove('done','current');
    if(i<currentQ) d.classList.add('done');
    else if(i===currentQ) d.classList.add('current');
  });
}

function renderQ(){
  document.getElementById('btnNext').textContent='继续 →';
  const q=questions[questionOrder[currentQ]];if(!q)return showResults();
  selectedOpt=-1;inCognitive=false;updateDots();
  const banner=document.getElementById('secBanner');

  banner.className='sec-banner '+bMap[q.section][0];
  banner.textContent=bMap[q.section][1];
  let content='<div class="q-num">第 '+(currentQ+1)+' / '+questionOrder.length+' 题</div>';
  content+='<div class="q-text">'+q.q+'</div>';

  const area=document.getElementById('optArea');area.innerHTML='';

    q.o.forEach((o,i)=>{
      const b=document.createElement('button');b.className='likert-btn';b.textContent=o;
      b.onclick=function(){row.querySelectorAll('.likert-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedOpt=i;document.getElementById('btnNext').disabled=false;};
      row.appendChild(b);
    });

    area.className='opts';
    q.o.forEach((o,i)=>{

      btn.onclick=function(){area.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');selectedOpt=i;document.getElementById('btnNext').disabled=false;};
      area.appendChild(btn);
    });
  }
  if(q.id===9) readingStart=Date.now();
}

function calcProvisionalScores(){
  const raw={},std={};
  Object.keys(dimSum).forEach(k=>{raw[k]=dimCount[k]>0?dimSum[k]/dimCount[k]:0;});
  Object.keys(raw).forEach(k=>{std[k]=Math.max(10,Math.min(98,Math.round(50+raw[k]*12)));});
  return std;
}
function buildAdaptiveQueue(){
  const prov=calcProvisionalScores();
  const sorted=Object.entries(prov).sort((a,b)=>a[1]-b[1]);
  const weakDims=new Set([sorted[0][0],sorted[1][0]]);
  const tail=questionOrder.slice(currentQ);
  tail.sort((a,b)=>{
    const qa=questions[a],qb=questions[b];
    const aW=qa.dim&&weakDims.has(qa.dim)?1:0;
    const bW=qb.dim&&weakDims.has(qb.dim)?1:0;
    if(aW!==bW)return bW-aW;
    return qa.section==='pref'?1:qb.section==='pref'?-1:0;
  });
  questionOrder=[...questionOrder.slice(0,currentQ),...tail];
}

function nextQ(){
  const q=questions[questionOrder[currentQ]];
  if(!inCognitive && q.section==='know'){
    const correct=selectedOpt===q.correct;
    answers.push({qid:q.id,type:'knowledge',answer:selectedOpt,correct});
    const sig=q.s[selectedOpt];
    if(sig) Object.keys(sig).forEach(k=>{dimSum[k]+=sig[k];dimCount[k]++;});
    if(q.id===9){const rt=(Date.now()-readingStart)/1000;if(rt>60)dimSum.speed-=2;else if(rt>40)dimSum.speed-=1;else if(rt<20)dimSum.speed+=1;dimCount.speed++;}
    inCognitive=true;renderCog();return;
  }
  if(inCognitive && q.section==='know'){
    const ct=cogQ.types[selectedOpt];
    const prevA=answers[answers.length-1];
    cogData.push({qid:q.id,correct:prevA.correct,cogType:ct});
    if(prevA.correct&&ct==='rule'){dimSum.grammar+=1;dimCount.grammar++;}
    else if(prevA.correct&&ct==='intuition'){dimSum.intuition+=1;dimCount.intuition++;dimSum.speed+=1;dimCount.speed++;}
    else if(!prevA.correct&&ct==='rule'){dimSum.grammar-=1;dimCount.grammar++;}
    else if(!prevA.correct&&ct==='intuition'){dimSum.intuition-=1;dimCount.intuition++;}
    inCognitive=false;currentQ++;
    if(!adaptiveBuilt&&currentQ>=9){buildAdaptiveQueue();adaptiveBuilt=true;}
    if(currentQ>=questionOrder.length){showResults();return;}
    if(cheerPoints.includes(currentQ)){document.getElementById('cheerMsg').innerHTML=cheerMsgs[cheerIdx];cheerIdx++;switchScr('scr-cheer');return;}
    renderQ();return;
  }
  // Non-knowledge
  if(q.section==='scene'){
    answers.push({qid:q.id,type:'scenario',answer:selectedOpt});
    const sig=q.s[selectedOpt];
    if(sig) Object.keys(sig).forEach(k=>{dimSum[k]+=sig[k];dimCount[k]++;});
  }else if(q.section==='self'){
    answers.push({qid:q.id,type:'self',answer:selectedOpt});
    dimSum[q.dim]+=q.lm[selectedOpt];dimCount[q.dim]++;
  }else if(q.section==='pref'){
    answers.push({qid:q.id,type:'preference',answer:selectedOpt,style:q.styles[selectedOpt]});
    stylePrefs.push(q.styles[selectedOpt]);
  }
  currentQ++;
  if(currentQ>=questionOrder.length){showResults();return;}
  if(cheerPoints.includes(currentQ)){document.getElementById('cheerMsg').innerHTML=cheerMsgs[cheerIdx];cheerIdx++;switchScr('scr-cheer');return;}
  renderQ();
}

function continueAfterCheer(){switchScr('scr-quiz');renderQ();}

  document.getElementById('qContent').innerHTML='<div class="q-num">追问</div><div class="q-text">'+cogQ.q+'</div>';

// ==================== SCORING ====================
function calcScores(){
  const raw={},std={};
  Object.keys(dimSum).forEach(k=>{raw[k]=dimCount[k]>0?dimSum[k]/dimCount[k]:0;});
  Object.keys(raw).forEach(k=>{std[k]=Math.max(10,Math.min(98,Math.round(50+raw[k]*12)));});
  const inputScore=Math.round(std.vocab*0.35+std.speed*0.35+std.intuition*0.30);
  const outputScore=Math.round(std.grammar*0.4+std.express*0.6);
  return{raw,std,inputScore,outputScore};
}

// ==================== TYPE CLASSIFICATION ====================
function classifyType(std,inputScore,outputScore){
  const gap=Math.abs(inputScore-outputScore);
  const{vocab:v,grammar:g,speed:sp,intuition:i,express:e,adapt:a}=std;
  const all=Object.values(std);
  const avg=all.reduce((x,y)=>x+y,0)/6;
  const sorted=Object.entries(std).sort((a,b)=>a[1]-b[1]);
  const wk=sorted[0];
  // 全面准备
  if(all.every(x=>x>=68)) return{id:'ready',name:'全面准备型',icon:'🌟',desc:'你的英语各方面基础扎实，已经为高中英语学习做好了充分准备。进入高中后，保持现在的学习节奏，你会走得很稳。',color:'#0D9488'};
  // 基础建设
  if(all.every(x=>x<45)) return{id:'building',name:'基础建设期',icon:'🏗️',desc:'你的英语基础正在搭建中，这是每个人都会经历的阶段。中考后的暑假是很好的"筑基窗口"，花些时间把地基打牢，高中会轻松很多。',color:'#FF8C42'};
  // 输入输出不对称
  if(gap>=18&&inputScore>outputScore) return{id:'input_lead',name:'输入领先型',icon:'📖',desc:'你的阅读和听力能力走在前面，这是一个很好的基础。接下来可以多关注"输出"——把读到的、听到的，试着说出来、写出来。',color:'#3B7CFF'};
  if(gap>=18&&outputScore>inputScore) return{id:'output_active',name:'表达活跃型',icon:'✍️',desc:'你敢说敢写，这是很多同龄人羡慕的能力。接下来多读多听，让你的表达有更丰富的"原材料"，准确性会自然提升。',color:'#DB2777'};
  // 按发展空间分类
  const weakGap=avg-wk[1];
  if(weakGap>=7){
    var typeMap={
      vocab:{id:'vocab_grow',name:'词汇扩展期',icon:'📚',desc:'词汇量的积累是你当前最有潜力的增长方向。好消息是：词汇是最"公平"的维度——投入时间就能看到回报。中考后的暑假每天积累一点，开学你会发现自己能读懂更多了。',color:'#3B7CFF'},
      grammar:{id:'grammar_grow',name:'语法精进期',icon:'📐',desc:'语法体系正在完善中，这是高中英语的重要基础。不需要焦虑——语法不是背出来的，是在大量阅读和练习中慢慢"长"进脑子的。',color:'#B45309'},
      speed:{id:'speed_grow',name:'速度提升期',icon:'⏱️',desc:'阅读速度的提升空间还很大。高中英语阅读量会比初中大很多，提前训练"不翻译、直接理解"的能力会让你在高中适应得更快。',color:'#FF6B35'},
      intuition:{id:'intuition_grow',name:'语感培养期',icon:'💡',desc:'对英语的自然感觉正在形成中。语感不是天赋，是大量正确输入积累出来的——多听多读，它会慢慢"长"出来。',color:'#7C3AED'},
      express:{id:'express_grow',name:'表达启动期',icon:'🗣️',desc:'目前还不太习惯用英语表达自己。这很正常——表达的前提是有足够的输入和足够的安全感。先从"低压力输出"开始，比如每天写一句话。',color:'#DB2777'},
      adapt:{id:'adapt_grow',name:'策略成长期',icon:'🧭',desc:'面对不熟悉的内容时会有些不安，这是人之常情。高中英语一定会遇到更多"不完全懂"的时刻——学会和它相处，是高中学习的重要一课。',color:'#0D9488'}
    };
    return typeMap[wk[0]];
  }
  return{id:'balanced',name:'均衡发展型',icon:'⚖️',desc:'你的英语各方面发展比较均衡，没有明显的发展落差。保持现在的学习节奏，进入高中后可以根据兴趣选择一两个方向深入发展。',color:'#6B7280'};
}

    speed:{title:'暑期阅读速度训练',desc:'每周3篇限时阅读：选中考真题阅读或高一入门阅读，先不限时读一遍理解大意，再计时5分钟重读一遍。慢慢你会发现阅读不需要逐词翻译。'},
    intuition:{title:'暑期语感浸泡计划',desc:'每天20分钟英语"背景音"：选你感兴趣的——英文歌、美剧片段、TED-Ed、英文vlog。不要求听懂每个词，让英语成为暑假生活的一部分。'},
    express:{title:'暑期表达启动计划',desc:'从"每日一句"开始，内容不限——可以吐槽天气、记录心情、评价一部电影。先坚持写，不纠错。两周后开始回看自己写的内容，看看哪些地方可以写得更好。'},
    adapt:{title:'暑期猜词策略训练',desc:'每周选一篇稍难一点的英语短文（比如21世纪报初中版），圈出不认识的词，先猜再查。目标是练出"不完全懂也能继续读下去"的能力。'}
  };
  plans.push(a1[growthK]||a1.vocab);
  if(strengthK!==growthK){
    const a2={
      vocab:{title:'利用词汇优势拓展阅读',desc:'既然词汇基础不错，这个暑假可以挑战更原汁原味的材料——英文短篇小说、简易新闻、BBC Learning English。'},

      express:{title:'保护你的表达热情',desc:'这份表达意愿是非常宝贵的动力。暑假可以试试用英语写日记、录英文vlog——让表达成为一种习惯而非任务。'},
      adapt:{title:'利用策略优势挑战新领域',desc:'既然你善于应对新内容，可以尝试看无字幕英文视频、读原版书——你的适应能力会让你进步得比别人快。'}
    };
    plans.push(a2[strengthK]||a2.vocab);
  }
  if(gap>=18&&type.id==='input_lead'){
    plans.push({title:'把"读懂"变成"写出来"',desc:'用你读过的短文做仿写：把主语换掉、时态改一下、加一个从句。这就是最低门槛的输出练习，不累但有效。'});
  }
  return plans;
}

// ==================== STORAGE ====================
const COLLECTION = 'senior_students';

async function getPreviousRecord(){
  if (!firebaseAvailable || !db) {
    try {
      const students = JSON.parse(localStorage.getItem('gt_eng_diag_senior_students') || '[]');
      const mine = students.filter(s => s.name === stuName && s.grade === stuGrade);
      return mine.length > 0 ? mine[mine.length - 1] : null;
    } catch(_) { return null; }
  }
  try{
    const snap=await db.collection(COLLECTION)
      .where('name','==',stuName).where('grade','==',stuGrade)
      .orderBy('timestamp','desc').limit(1).get();
    if(snap.empty) return null;
    const doc=snap.docs[0];
    const d=doc.data();
    d.id=doc.id;
    return d;
  }catch(e){
    console.error('Firestore query failed:',e);
    const students=JSON.parse(localStorage.getItem('gt_eng_diag_senior_students')||'[]');
    const mine=students.filter(s=>s.name===stuName&&s.grade===stuGrade);
    return mine.length>0?mine[mine.length-1]:null;
  }
}

function saveToStorage(std,inputScore,outputScore,gap,type){
  var ts = new Date().toISOString();
  try { if (firebaseAvailable && db) ts = firebase.firestore.FieldValue.serverTimestamp(); } catch(_) {}
  const data={
    name:stuName,grade:stuGrade,
    date:new Date().toISOString().slice(0,10),
    std,inputScore,outputScore,gap,
    type:type.id,typeName:type.name,typeIcon:type.icon,
    weakKey:Object.entries(std).sort((a,b)=>a[1]-b[1])[0][0],
    strongKey:Object.entries(std).sort((a,b)=>a[1]-b[1]).reverse()[0][0],
    cogData,stylePrefs,
    timestamp: ts
  };

  // Always save to localStorage first
  var key = 'gt_eng_diag_senior_students';
  var students = [];
  try { students = JSON.parse(localStorage.getItem(key) || '[]'); } catch(_) {}
  students.push({id: Date.now(), ...data, timestamp: new Date().toISOString()});
  try { localStorage.setItem(key, JSON.stringify(students)); } catch(_) {}

  if (!firebaseAvailable || !db) {
    console.log('📦 Saved to localStorage (Firebase not available)');
    return Promise.resolve();
  }

  return db.collection(COLLECTION).add(data).catch(function(e){
    console.error('Firestore save failed, kept in localStorage:', e);
  });
}
